name: Contract bundle
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose contract bundle to publish (for example v0.2.0-rc.26)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: The release tag whose contract bundle to publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    concurrency:
      group: ploeg-contract-bundle-${{ inputs.tag || github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    if: >-
      github.repository == 'ploeg-hq/ploeg' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v0.')))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: release
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21
          cache: false
      - name: Wait until the Go module proxy and checksum database serve the tag
        run: bash scripts/go-module-published.sh "$RELEASE_TAG"
      - name: Publish the contract bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- bash scripts/contract-bundle.sh publish "$RELEASE_TAG" release
