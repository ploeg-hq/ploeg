name: CI
on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLOEG_COMPAT_REQUIRE_BASE: "1"
      PLOEG_REQUIRE_PID_NAMESPACE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache: false
      - run: mise run setup
      - name: Allow the unprivileged user and PID namespace the harness container drill runs in
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: mise run verify
      - name: The history starts at the recorded root and the initial tree is the recorded derivation of its frozen source
        run: bash scripts/check-provenance.sh --source
      - run: mise run docs-check
      - name: Build controller and worker image
        run: docker build --file ops/docker/ploegd/Dockerfile --tag ploeg-ci:${GITHUB_SHA} .
      - name: Build the ploeg-worker image and run git in it
        run: |
          docker build --file ops/docker/ploeg-worker/Dockerfile --tag ploeg-worker-ci:${GITHUB_SHA} .
          docker run --rm --user 1000:1000 --entrypoint /usr/bin/git ploeg-worker-ci:${GITHUB_SHA} --version
      - name: Every Go binary in the images is built with go.mod's toolchain
        run: |
          mise exec -- bash scripts/check-go-toolchain.sh ploeg-ci:${GITHUB_SHA}
          mise exec -- bash scripts/check-go-toolchain.sh ploeg-worker-ci:${GITHUB_SHA}
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/dco-check.sh "$BASE" "$HEAD"
  contract-bundle-reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache: false
      - name: This change still builds the published bundle of the newest release tag byte for byte
        run: mise exec -- bash scripts/reproduce-published-contract-bundle.sh
  worker-admission:
    name: worker-admission (Kubernetes ${{ matrix.kubernetes }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.30"
            node-image: kindest/node:v1.30.13@sha256:397209b3d947d154f6641f2d0ce8d473732bd91c87d9575ade99049aa33cd648
          - kubernetes: "1.37"
            node-image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache: false
      - name: Start a disposable cluster at the policy's oldest and newest supported Kubernetes
        env:
          NODE_IMAGE: ${{ matrix.node-image }}
        run: mise exec -- kind create cluster --name worker-admission --image "$NODE_IMAGE" --wait 180s
      - name: The API server type-checks the worker admission policy, admits every rendered worker pod and refuses each hostile variant by its own rule
        run: mise exec -- uv run --no-project --with pyyaml==6.0.3 python scripts/check-worker-admission-live.py
  hostile-repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOOSE_VERSION: 1.52.0
      GOOSE_SHA256: fdc86653285a89f7dcad6e76736af1688ab2cde44661b089328b2fc40bb79f9f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache: false
      - name: Install goose
        run: |
          curl -fsSL -o goose.tar.gz "https://github.com/aaif-goose/goose/releases/download/v${GOOSE_VERSION}/goose-x86_64-unknown-linux-musl.tar.gz"
          echo "${GOOSE_SHA256}  goose.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf goose.tar.gz -C "$RUNNER_TEMP/bin" ./goose
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: A repository's plugins never start inside a Run
        run: PLOEG_HOSTILE_REPOSITORY=1 mise exec -- go test -run TestHostileRepository -v ./pkg/harness/adapters/acp/
