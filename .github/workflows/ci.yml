name: CI
on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache: false
      - run: mise run setup
      - run: mise run verify
      - run: mise run docs-check
      - name: Build controller and worker image
        run: docker build --file ops/docker/ploegd/Dockerfile --tag ploeg-ci:${GITHUB_SHA} .
  contract-bundle-reproducible:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CONTRACT_BUNDLE_REFERENCE_TAG: v0.2.0-rc.36
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.CONTRACT_BUNDLE_REFERENCE_TAG }}
          path: reference
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache: false
      - name: This change still builds the published bundle of the reference tag byte for byte
        run: mise exec -- bash scripts/contract-bundle.sh reproduce "$CONTRACT_BUNDLE_REFERENCE_TAG" reference
  hostile-repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOOSE_VERSION: 1.52.0
      GOOSE_SHA256: fdc86653285a89f7dcad6e76736af1688ab2cde44661b089328b2fc40bb79f9f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache: false
      - name: Install goose
        run: |
          curl -fsSL -o goose.tar.gz "https://github.com/aaif-goose/goose/releases/download/v${GOOSE_VERSION}/goose-x86_64-unknown-linux-musl.tar.gz"
          echo "${GOOSE_SHA256}  goose.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf goose.tar.gz -C "$RUNNER_TEMP/bin" ./goose
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: A repository's plugins never start inside a Run
        run: PLOEG_HOSTILE_REPOSITORY=1 mise exec -- go test -run TestHostileRepository -v ./pkg/harness/adapters/acp/
