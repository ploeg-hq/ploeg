name: Release
on:
  push:
    tags: ['v0.*', '!v0.*-rc.*']
  workflow_call:
    inputs:
      tag:
        description: Candidate tag the release candidate workflow just cut
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag whose publication is missing; a stable tag needs a matching chart version (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'ploeg-hq/ploeg'
    runs-on: ubuntu-24.04
    concurrency:
      group: ploeg-publish-${{ inputs.tag || github.ref_name }}
      cancel-in-progress: false
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable release input
        run: bash scripts/release.sh validate "$RELEASE_TAG"
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          version: 2026.10.17
          cache: false
      - run: mise run setup
      - name: Allow the unprivileged user and PID namespace the harness container drill runs in
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: mise run verify
        env:
          PLOEG_REQUIRE_PID_NAMESPACE: "1"
      - run: mise run docs-check
      - name: Publish versioned artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- bash scripts/release.sh publish "$RELEASE_TAG"
