name: Release
on:
  push:
    tags: ['v0.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed tag with matching chart version (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ploeg-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'ploeg-hq/ploeg'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable release input
        run: bash scripts/release.sh validate "$RELEASE_TAG"
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache: false
      - run: mise run setup
      - run: mise run verify
      - run: mise run docs-check
      - name: Publish versioned artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- bash scripts/release.sh publish "$RELEASE_TAG"
