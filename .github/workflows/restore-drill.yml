name: Restore drill
on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
  push:
    branches: [main, development]
    paths:
      - "pkg/store/**"
      - "pkg/httpapi/**"
      - "pkg/shiftengine/**"
      - "pkg/worker/**"
      - "go.mod"
      - ".github/workflows/restore-drill.yml"
  pull_request:
    paths:
      - "pkg/store/**"
      - "pkg/httpapi/**"
      - "pkg/shiftengine/**"
      - "pkg/worker/**"
      - "go.mod"
      - ".github/workflows/restore-drill.yml"
permissions:
  contents: read
concurrency:
  group: restore-drill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  restore:
    name: Back up, destroy, restore and reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
          cache: false
      - run: mise run setup
      - name: A restored database reconciles to its backup point and fences every older lease
        run: mise run restore-drill

  report:
    name: Open an issue on a scheduled failure
    runs-on: ubuntu-24.04
    needs: [restore]
    if: ${{ failure() && github.event_name == 'schedule' }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the restore-drill issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          title="Restore drill failed on the schedule"
          body="The scheduled restore drill failed. A restored database may no longer reconcile to its backup point, or a lease from before the restore may change authority. Run: ${RUN_URL}"
          existing=$(gh issue list --repo "$REPO" --state open --label restore-drill --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh label create restore-drill --repo "$REPO" --color b60205 --description "A scheduled restore drill failed" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$title" --label restore-drill --body "$body"
          fi
