name: CodeQL
on:
  pull_request:
  push:
    branches: [main, development]
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.0
          install_args: go
          cache: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: go
          build-mode: manual
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build every package
        run: mise exec -- go build ./...
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:go
          output: ${{ runner.temp }}/codeql
          upload: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'always' || 'never' }}
      - name: No High or Critical security finding outside ops/security/codeql-accepted.yaml
        env:
          SARIF_DIR: ${{ runner.temp }}/codeql
          SCOPE: ${{ github.event_name == 'pull_request' && 'diff-informed' || 'complete' }}
        run: mise exec -- go run ./internal/codeqlgate/cmd/codeql-gate
      - name: Code scanning shows every accepted finding as dismissed
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          mise exec -- go run ./internal/codeqlgate/cmd/codeql-gate dismissals | jq -c '.[]' | while read -r accepted; do
            rule=$(jq -r .rule <<<"$accepted")
            file=$(jq -r .file <<<"$accepted")
            dismissal=$(jq -r .dismissal <<<"$accepted")
            gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?tool_name=CodeQL&state=open&ref=$REF&per_page=100" \
              --jq ".[] | select(.rule.id == \"$rule\" and .most_recent_instance.location.path == \"$file\") | .number" |
            while read -r alert; do
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/code-scanning/alerts/$alert" \
                -f state=dismissed -f dismissed_reason="$dismissal" \
                -f dismissed_comment="Accepted in ops/security/codeql-accepted.yaml at $SHA" > /dev/null
              echo "dismissed alert $alert: $rule in $file"
            done
          done
