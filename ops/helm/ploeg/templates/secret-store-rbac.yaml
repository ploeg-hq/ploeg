{{- if eq .Values.secretStore.type "kubernetes" }}
{{- $namespace := .Values.secretStore.kubernetes.namespace | default .Release.Namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ploeg.fullname" . }}-secret-store
  namespace: {{ $namespace }}
  labels: {{- include "ploeg.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ploeg.fullname" . }}-secret-store
  namespace: {{ $namespace }}
  labels: {{- include "ploeg.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ploeg.fullname" . }}-secret-store
subjects:
  - kind: ServiceAccount
    name: {{ include "ploeg.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
