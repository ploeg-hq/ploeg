{{- if include "ploeg.credentialGatewayEnabled" . }}
{{- include "ploeg.requireCredentialGatewayValues" . }}
{{- $gw := .Values.executor.credentialGateway }}
{{- $name := include "ploeg.credentialGatewayName" . }}
{{- $tokenDir := "/var/run/secrets/ploeg/gateway" }}
{{- $bootstrapDir := "/var/run/secrets/ploeg/bootstraps" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  {{- with include "ploeg.executorNamespaceMetadata" . }}
  {{ . }}
  {{- end }}
  labels: {{- include "ploeg.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  {{- with include "ploeg.executorNamespaceMetadata" . }}
  {{ . }}
  {{- end }}
  labels: {{- include "ploeg.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  {{- with include "ploeg.executorNamespaceMetadata" . }}
  {{ . }}
  {{- end }}
  labels: {{- include "ploeg.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "ploeg.executorNamespace" . }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  {{- with include "ploeg.executorNamespaceMetadata" . }}
  {{ . }}
  {{- end }}
  labels: {{- include "ploeg.labels" . | nindent 4 }}
spec:
  replicas: {{ $gw.replicas }}
  selector:
    matchLabels: {{- include "ploeg.credentialGatewaySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ploeg.credentialGatewaySelectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: ploeg
        ploeg.webgrip.dev/component: credential-gateway
        {{- if $gw.acknowledgeSingleNode }}
        ploeg.webgrip.dev/credential-gateway-shared-node: "true"
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $gw.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $gw.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity: {{- include "ploeg.credentialGatewayAffinity" . | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: credential-gateway
          image: {{ (include "ploeg.workerImageSource" . | fromJson).image }}
          command: ["/usr/local/bin/ploeg-credential-gateway"]
          ports:
            - name: control
              containerPort: 8080
            - name: forge
              containerPort: 8081
            - name: model
              containerPort: 8082
            - name: mcp
              containerPort: 8083
            - name: health
              containerPort: 8090
          env:
            - name: PLOEG_API_URL
              value: {{ include "ploeg.workerApiUrl" . | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PLOEG_GATEWAY_MODEL_URL
              value: {{ .Values.executor.litellm.baseUrl | quote }}
            - name: PLOEG_GATEWAY_LIMITS
              value: {{ $gw.limits | toJson | quote }}
            - name: PLOEG_GATEWAY_TOKEN_FILE
              value: {{ printf "%s/token" $tokenDir | quote }}
            - name: PLOEG_GATEWAY_BOOTSTRAP_DIR
              value: {{ $bootstrapDir | quote }}
            - name: PLOEG_GATEWAY_RUN_POD_SELECTOR
              value: "app.kubernetes.io/name=ploeg-worker"
            {{- with include "ploeg.goMemLimitEnv" (dict "goMemLimit" "" "resources" $gw.resources) | trim }}{{ . | nindent 12 }}{{- end }}
          volumeMounts:
            - name: gateway-token
              mountPath: {{ $tokenDir }}
              readOnly: true
            - name: bootstraps
              mountPath: {{ $bootstrapDir }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          resources: {{- toYaml $gw.resources | nindent 12 }}
      volumes:
        - name: gateway-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: ploegd
                  expirationSeconds: 600
                  path: token
        - name: bootstraps
          secret:
            secretName: {{ .Values.executor.workerAuth.bootstrapSecret.name }}
            items:
              {{- range $key := (include "ploeg.credentialGatewayBootstrapKeys" . | fromJsonArray) }}
              - key: {{ $key | quote }}
                path: {{ $key | quote }}
              {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ $gw.scratchSizeLimit }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  {{- with include "ploeg.executorNamespaceMetadata" . }}
  {{ . }}
  {{- end }}
  labels: {{- include "ploeg.labels" . | nindent 4 }}
spec:
  selector: {{- include "ploeg.credentialGatewaySelectorLabels" . | nindent 4 }}
  ports:
    - name: control
      port: 8080
      targetPort: control
    - name: forge
      port: 8081
      targetPort: forge
    - name: model
      port: 8082
      targetPort: model
    - name: mcp
      port: 8083
      targetPort: mcp
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  {{- with include "ploeg.executorNamespaceMetadata" . }}
  {{ . }}
  {{- end }}
  labels: {{- include "ploeg.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {{- include "ploeg.credentialGatewaySelectorLabels" . | nindent 6 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ploeg.fullname" . }}-tokenreview
  labels: {{- include "ploeg.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ploeg.fullname" . }}-tokenreview
  labels: {{- include "ploeg.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ploeg.fullname" . }}-tokenreview
subjects:
  - kind: ServiceAccount
    name: {{ include "ploeg.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
