{{- if .Values.security.workerAdmission.enabled }}
{{- if not (semverCompare ">=1.30.0-0" .Capabilities.KubeVersion.Version) }}
{{- fail "Native CEL admission requires Kubernetes >= 1.30; use a supported cluster policy engine on older clusters" }}
{{- end }}
{{- $name := printf "%s-%s-agent-security" (include "ploeg.fullname" .) .Release.Namespace | trunc 253 | trimSuffix "-" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
    objectSelector:
      matchLabels:
        app.kubernetes.io/name: ploeg-worker
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  variables:
    - name: allContainers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])"
  validations:
    - expression: "!has(object.spec.hostNetwork) || !object.spec.hostNetwork"
      message: "Host networking is forbidden."
    - expression: "!has(object.spec.hostPID) || !object.spec.hostPID"
      message: "Host PID sharing is forbidden."
    - expression: "!has(object.spec.hostIPC) || !object.spec.hostIPC"
      message: "Host IPC sharing is forbidden."
    - expression: "!has(object.spec.shareProcessNamespace) || !object.spec.shareProcessNamespace"
      message: "Sharing the pod process namespace defeats worker credential isolation."
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: "Agent pods must explicitly disable automatic Kubernetes API credentials."
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))"
      message: "Host paths, including host container-runtime sockets, are forbidden."
    - expression: "variables.allContainers.all(c, has(c.securityContext) && (!has(c.securityContext.privileged) || !c.securityContext.privileged) && has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation && has(c.securityContext.capabilities) && has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop && (!has(c.securityContext.capabilities.add) || size(c.securityContext.capabilities.add) == 0))"
      message: "Every container must disable privilege escalation, drop ALL capabilities and add none."
    - expression: "variables.allContainers.all(c, has(c.securityContext) && (!has(c.securityContext.runAsUser) || c.securityContext.runAsUser != 0) && (has(c.securityContext.runAsNonRoot) ? c.securityContext.runAsNonRoot : (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot))) && (!has(object.spec.securityContext) || !has(object.spec.securityContext.runAsUser) || object.spec.securityContext.runAsUser != 0)"
      message: "Every container must run as non-root."
    - expression: "variables.allContainers.all(c, has(c.securityContext) && (has(c.securityContext.seccompProfile) ? c.securityContext.seccompProfile.type in ['RuntimeDefault', 'Localhost'] : (has(object.spec.securityContext) && has(object.spec.securityContext.seccompProfile) && object.spec.securityContext.seccompProfile.type in ['RuntimeDefault', 'Localhost'])))"
      message: "Every container must use RuntimeDefault or a provisioned Localhost seccomp profile."
    {{- if .Values.security.workerAdmission.runtimeClassNames }}
    - expression: {{ printf "has(object.spec.runtimeClassName) && object.spec.runtimeClassName in %s" (toJson .Values.security.workerAdmission.runtimeClassNames) | quote }}
      message: "The pod must use an explicitly allowed, installed sandbox RuntimeClass."
    {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- end }}

