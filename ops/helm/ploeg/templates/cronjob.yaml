{{- if and .Values.executor.enabled (eq (.Values.executor.type | default "keda") "cronjob") }}
{{- $root := . }}
{{- range $team := .Values.executor.teams }}
{{- range $role := (include "ploeg.teamRoles" $team | fromJsonArray) }}
---
# The KEDA-free executor (docs/contracts/executor.md): a plain CronJob per
# (team, Role) polls by spawning a worker on a schedule. Empty-handed claim =
# exit 0 (backlog #49) makes idle ticks free; retries stay DB-side (lease
# expiry), so concurrencyPolicy/backoffLimit mirror the ScaledJob semantics.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "ploeg.workloadName" (dict "root" $root "team" $team "role" $role) }}
  labels: {{- include "ploeg.labels" $root | nindent 4 }}
spec:
  schedule: {{ $root.Values.executor.cronjob.schedule | quote }}
  # One run at a time per workload; the Lease (writers) and the Run's own
  # deadline (readers) are the real locks.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      parallelism: 1
      completions: 1
      backoffLimit: 0 # ploeg owns retries; every pod is one auditable run (backlog #51)
      activeDeadlineSeconds: {{ $root.Values.executor.activeDeadlineSeconds }}
      template:
        {{- include "ploeg.workerPodTemplate" (dict "root" $root "team" $team "role" $role) | nindent 8 }}
{{- end }}
{{- end }}
{{- end }}
