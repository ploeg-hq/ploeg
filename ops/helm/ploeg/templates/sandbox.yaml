{{- if and .Values.executor.enabled (include "ploeg.anyTeamOnSandbox" .) }}
{{- $root := . }}
{{- $sb := .Values.executor.sandbox }}
{{- range $team := .Values.executor.teams }}
{{- if eq (include "ploeg.teamExecutorType" (dict "root" $root "team" $team)) "sandbox" }}
{{- range $planRole := (include "ploeg.teamRoles" $team | fromJsonArray) }}
{{- range $w := (include "ploeg.workerWorkloads" (dict "root" $root "team" $team "role" $planRole) | fromJsonArray) }}
{{- $role := $w.role }}
{{- $name := include "ploeg.workloadName" (dict "root" $root "team" $team "role" $role "suffix" $w.suffix) }}
{{- $pod := include "ploeg.workerPodTemplate" (dict "root" $root "team" $team "role" $role) | fromYaml }}
{{- $_ := set $pod.spec "activeDeadlineSeconds" $root.Values.executor.activeDeadlineSeconds }}
{{- $_ := set $pod.spec "dnsPolicy" "ClusterFirst" }}
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: {{ $name }}
  {{- with include "ploeg.executorNamespaceMetadata" $root }}
  {{ . }}
  {{- end }}
  labels: {{- include "ploeg.labels" $root | nindent 4 }}
spec:
  podTemplate: {{- toYaml $pod | nindent 4 }}
  service: false
  {{- if $sb.networkPolicy }}
  networkPolicyManagement: Managed
  networkPolicy: {{- toYaml $sb.networkPolicy | nindent 4 }}
  {{- else }}
  networkPolicyManagement: Unmanaged
  {{- end }}
  envVarsInjectionPolicy: Disallowed
---
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxWarmPool
metadata:
  name: {{ $name }}
  {{- with include "ploeg.executorNamespaceMetadata" $root }}
  {{ . }}
  {{- end }}
  labels: {{- include "ploeg.labels" $root | nindent 4 }}
spec:
  replicas: 0
  sandboxTemplateRef:
    name: {{ $name }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ploeg.sandboxLauncherName" $root }}
  {{- with include "ploeg.executorNamespaceMetadata" $root }}
  {{ . }}
  {{- end }}
  labels: {{- include "ploeg.labels" $root | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ploeg.sandboxLauncherName" $root }}
  {{- with include "ploeg.executorNamespaceMetadata" $root }}
  {{ . }}
  {{- end }}
  labels: {{- include "ploeg.labels" $root | nindent 4 }}
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ploeg.sandboxLauncherName" $root }}
  {{- with include "ploeg.executorNamespaceMetadata" $root }}
  {{ . }}
  {{- end }}
  labels: {{- include "ploeg.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ploeg.sandboxLauncherName" $root }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ploeg.sandboxLauncherName" $root }}
    namespace: {{ include "ploeg.executorNamespace" $root }}
{{- end }}
