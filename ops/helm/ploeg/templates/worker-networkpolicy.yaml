{{- if .Values.security.workerNetworkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ploeg.fullname" . }}-worker-boundary
  labels: {{- include "ploeg.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ploeg-worker
      app.kubernetes.io/instance: {{ include "ploeg.instance" . }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels: {{- include "ploeg.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- with .Values.security.workerNetworkPolicy.dns }}
    - to:
        - {{- toYaml . | nindent 10 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- end }}
    {{- with .Values.security.workerNetworkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
