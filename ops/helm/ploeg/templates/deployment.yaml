{{- include "ploeg.requireIntegrations" . }}
{{- include "ploeg.requireSupportProfile" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ploeg.fullname" . }}
  labels: {{- include "ploeg.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: {{- include "ploeg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ploeg.selectorLabels" . | nindent 8 }}
        ploeg.webgrip.dev/component: daemon
      {{- if .Values.config }}
      annotations:
        # Config is read once at boot, so a change has to restart the pod.
        ploeg.webgrip.dev/config-checksum: {{ toYaml .Values.config | sha256sum | trunc 16 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ploeg.fullname" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ploegd
          image: {{ include "ploeg.image" . }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          {{- if .Values.config }}
          volumeMounts:
            - name: config
              mountPath: /etc/ploeg
              readOnly: true
          {{- end }}
          env:
            {{- if .Values.config }}
            - name: PLOEG_CONFIG
              value: /etc/ploeg/ploeg.yaml
            {{- end }}
            - name: PLOEG_LISTEN
              value: ":8080"
            - name: PLOEG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret.name is required: name the Secret that holds ploegd's PostgreSQL connection URI (CloudNativePG creates <cluster>-app with a uri key)" .Values.database.existingSecret.name }}
                  key: {{ .Values.database.existingSecret.key | default "uri" }}
            {{- $poolEnv := dict "maxConns" "PLOEG_DB_MAX_CONNS" "minIdleConns" "PLOEG_DB_MIN_IDLE_CONNS" "maxConnLifetime" "PLOEG_DB_MAX_CONN_LIFETIME" "maxConnLifetimeJitter" "PLOEG_DB_MAX_CONN_LIFETIME_JITTER" "maxConnIdleTime" "PLOEG_DB_MAX_CONN_IDLE_TIME" "healthCheckPeriod" "PLOEG_DB_HEALTH_CHECK_PERIOD" "pingTimeout" "PLOEG_DB_PING_TIMEOUT" "applicationName" "PLOEG_DB_APPLICATION_NAME" "statementTimeout" "PLOEG_DB_STATEMENT_TIMEOUT" "idleInTransactionTimeout" "PLOEG_DB_IDLE_IN_TRANSACTION_TIMEOUT" }}
            {{- $pool := .Values.database.pool | default dict }}
            {{- range $key, $name := $poolEnv }}
            {{- $value := get $pool $key }}
            {{- if ne (toString $value) "" }}
            {{- if ne (kindOf $value) "invalid" }}
            - name: {{ $name }}
              value: {{ toString $value | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with include "ploeg.goMemLimitEnv" (dict "goMemLimit" .Values.goMemLimit "env" .Values.env "resources" .Values.resources) | trim }}{{ . | nindent 12 }}{{- end }}
            {{- with .Values.webhook.existingSecret }}
            {{- if .name }}
            - name: PLOEG_VIKUNJA_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            {{- /* Team plans (run-multi-agent-shifts): ploegd's shift engine
                 reads the same plan the workload templates partition on, so
                 there is exactly one source of truth — executor.teams[].plan.
                 The pool is the team's budget value. Only planned teams are
                 serialised; no plans, no env, and dispatch is unchanged. */}}
            {{- $plans := dict }}
            {{- range .Values.executor.teams }}
            {{- if .plan }}
            {{- $_ := set $plans .name (dict "pool" (.budget | default "0") "rounds" .plan "maxFixRounds" (.maxFixRounds | default 0)) }}
            {{- end }}
            {{- end }}
            {{- if $plans }}
            - name: PLOEG_TEAM_PLANS
              value: {{ toJson $plans | quote }}
            {{- end }}
            {{- /* Each Role's configured Harness (ADR-0097), from the same
                 ploeg.roleHarness the worker pod template reads, so the
                 Teams read cannot disagree with PLOEG_HARNESS and
                 PLOEG_ACP_PROFILE. A plan-less team's one workload is the
                 Role "". The profile is the one the acp worker runs:
                 opencode when none is set. */}}
            {{- $harnesses := dict }}
            {{- if .Values.executor.enabled }}
            {{- range $team := .Values.executor.teams }}
            {{- $roles := dict }}
            {{- range $role := (include "ploeg.teamRoles" $team | fromJsonArray) }}
            {{- $entry := dict }}
            {{- $allowed := list }}
            {{- range $w := (include "ploeg.roleWorkloads" (dict "root" $ "team" $team "role" $role) | fromJsonArray) }}
            {{- $h := include "ploeg.roleHarness" (dict "root" $ "team" $team "role" $w.role) | fromJson }}
            {{- $a := dict "name" $h.name "qualification" (ternary "qualified" "unqualified" $w.qualified) }}
            {{- if eq $h.name "acp" }}
            {{- $_ := set $a "profile" ($h.acpProfile | default "opencode") }}
            {{- end }}
            {{- $allowed = append $allowed $a }}
            {{- if $w.default }}
            {{- $entry = omit $a "qualification" }}
            {{- if eq ($w.carrier | default "") "client" }}
            {{- $_ := set $entry "carrier" "client" }}
            {{- $_ := set $entry "environmentId" $w.environmentId }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- $_ := set $entry "allowed" $allowed }}
            {{- $_ := set $entry "allowUnqualified" ($team.allowUnqualifiedHarnesses | default false) }}
            {{- $_ := set $roles ($role.name | default "") $entry }}
            {{- end }}
            {{- $_ := set $harnesses $team.name $roles }}
            {{- end }}
            {{- end }}
            {{- if $harnesses }}
            - name: PLOEG_TEAM_HARNESSES
              value: {{ toJson $harnesses | quote }}
            {{- end }}
            {{- $maxRunning := dict }}
            {{- range .Values.executor.teams }}
            {{- if .maxRunning }}
            {{- $_ := set $maxRunning .name (.maxRunning | int) }}
            {{- end }}
            {{- end }}
            {{- if $maxRunning }}
            - name: PLOEG_TEAM_MAX_RUNNING
              value: {{ toJson $maxRunning | quote }}
            {{- end }}
            {{- /* The forge seam: ploegd publishes findings to the pull
                 request as the same bot that opens them (ADR-0011). Commenting
                 is not pushing, so no second credential — but without a URL
                 there is no ForgeProvider and findings stay in the database. */}}
            {{- with .Values.executor.forgejo }}
            {{- /* ADR-0013 tier 2: the bot's password MINTS per-run push
                 tokens, each limited to the Run's repository. Held only by
                 ploegd, never by a worker (R6). Forgejo creates tokens only
                 for a password sign-in, so the admin token this chart once
                 took never minted anything. Unset = nothing is minted and
                 workers keep the shared token. */}}
            {{- if .adminTokenSecret }}
            {{- fail "executor.forgejo.adminTokenSecret is not supported: Forgejo refuses to create access tokens with a token. Set executor.forgejo.botPasswordSecret to a secret holding the bot user's password" }}
            {{- end }}
            {{- if .publicUrl | default .url }}
            - name: PLOEG_FORGEJO_URL
              value: {{ .publicUrl | default .url | quote }}
            - name: PLOEG_FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .tokenSecret.name }}
                  key: {{ .tokenSecret.key }}
            {{- with .botPasswordSecret }}
            - name: PLOEG_FORGEJO_BOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- with .botUser }}
            - name: PLOEG_FORGEJO_BOT
              value: {{ . | quote }}
            {{- end }}
            {{- with .webhookSecret }}
            - name: PLOEG_FORGEJO_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.executor.gitlab }}
            {{- if .url }}
            - name: PLOEG_GITLAB_URL
              value: {{ .publicUrl | default .url | quote }}
            - name: PLOEG_GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .tokenSecret.name }}
                  key: {{ .tokenSecret.key }}
            {{- with .webhookSecret }}
            - name: PLOEG_GITLAB_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.executor.github }}
            {{- if .url }}
            {{- /* ADR-0086: the GitHub App id and key are read from
                 tracker.github, which renders PLOEG_GITHUB_APP_ID and
                 PLOEG_GITHUB_APP_PRIVATE_KEY once for both. */}}
            - name: PLOEG_GITHUB_URL
              value: {{ .url | quote }}
            {{- if not ((($.Values.tracker | default dict).github | default dict).appId) }}
            - name: PLOEG_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .tokenSecret.name }}
                  key: {{ .tokenSecret.key }}
            {{- end }}
            {{- with .webhookSecret }}
            - name: PLOEG_GITHUB_FORGE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- with .botLogin }}
            - name: PLOEG_GITHUB_BOT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            - name: PLOEG_TARGET_FORGE
              value: {{ .Values.executor.forge | default "forgejo" | quote }}
            {{- with .Values.tracker }}
            {{- if .url }}
            - name: PLOEG_VIKUNJA_URL
              value: {{ .url | quote }}
            {{- end }}
            {{- if .tokenSecret }}
            - name: PLOEG_VIKUNJA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .tokenSecret.name }}
                  key: {{ .tokenSecret.key }}
            {{- end }}
            {{- end }}
            {{- with .Values.tracker.clickup }}
            {{- with .webhookSecret }}
            - name: PLOEG_CLICKUP_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- with .tokenSecret }}
            - name: PLOEG_CLICKUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- if .url }}
            - name: PLOEG_CLICKUP_URL
              value: {{ .url | quote }}
            {{- end }}
            {{- if .doneStatus }}
            - name: PLOEG_CLICKUP_DONE_STATUS
              value: {{ .doneStatus | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.tracker.github }}
            {{- with .webhookSecret }}
            - name: PLOEG_GITHUB_TRACKER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- if .apiUrl }}
            - name: PLOEG_GITHUB_API_URL
              value: {{ .apiUrl | quote }}
            {{- end }}
            {{- if .appId }}
            - name: PLOEG_GITHUB_APP_ID
              value: {{ .appId | quote }}
            - name: PLOEG_GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "tracker.github.appPrivateKeySecret.name is required with tracker.github.appId" .appPrivateKeySecret.name }}
                  key: {{ required "tracker.github.appPrivateKeySecret.key is required with tracker.github.appId" .appPrivateKeySecret.key }}
            {{- end }}
            {{- if .teamLabelPrefix }}
            - name: PLOEG_GITHUB_TEAM_LABEL_PREFIX
              value: {{ .teamLabelPrefix | quote }}
            {{- end }}
            {{- if .teamMap }}
            - name: PLOEG_GITHUB_TEAM_MAP
              value: {{ .teamMap | quote }}
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- with .Values.executor.litellm }}
            {{- if .adminUrl }}
            - name: LITELLM_ADMIN_URL
              value: {{ .adminUrl | quote }}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .masterKeySecret.name }}
                  key: {{ .masterKeySecret.key }}
            {{- end }}
            {{- end }}
            {{- with .Values.deploys }}
            {{- with .tokenSecret }}
            - name: PLOEG_DEPLOY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            {{- with .Values.runIdentity }}
            {{- with .signingKeySecret }}
            - name: PLOEG_RUN_IDENTITY_ISSUER
              value: {{ required "runIdentity.issuer is required with runIdentity.signingKeySecret" $.Values.runIdentity.issuer | quote }}
            - name: PLOEG_RUN_IDENTITY_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- with .retiredKeysSecret }}
            - name: PLOEG_RUN_IDENTITY_RETIRED_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            {{- with .Values.knowledgeGraph }}
            {{- if .url }}
            - name: PLOEG_OMNIGRAPH_URL
              value: {{ .url | quote }}
            {{- if not (or .notesGraph .conceptsGraph) }}
            {{- fail "knowledgeGraph.url needs knowledgeGraph.notesGraph, knowledgeGraph.conceptsGraph or both" }}
            {{- end }}
            {{- with .notesGraph }}
            - name: PLOEG_NOTES_GRAPH
              value: {{ . | quote }}
            {{- end }}
            {{- with .conceptsGraph }}
            - name: PLOEG_KNOWLEDGE_GRAPH
              value: {{ . | quote }}
            {{- end }}
            - name: PLOEG_OMNIGRAPH_RUN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "knowledgeGraph.runTokenSecret.name is required with knowledgeGraph.url" .runTokenSecret.name }}
                  key: {{ .runTokenSecret.key | default "token" }}
            {{- with .reviewTokenSecret }}
            - name: PLOEG_OMNIGRAPH_REVIEW_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "knowledgeGraph.reviewTokenSecret.name is required with knowledgeGraph.reviewTokenSecret" .name }}
                  key: {{ .key | default "token" }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- include "ploeg.workerControlEnv" . | nindent 12 }}
            {{- if .Values.operator.consumers }}
            {{- include "ploeg.operatorControlEnv" . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.config }}
      volumes:
        - name: config
          configMap:
            name: {{ include "ploeg.fullname" . }}-config
      {{- end }}
