{{- $pr := .Values.monitoring.prometheusRule }}
{{- if $pr.enabled }}
{{- $sel := $pr.selector | default (printf "job=%q,namespace=%q" (include "ploeg.fullname" .) .Release.Namespace) }}
{{- $a := $pr.alerts }}
{{- $runbook := $pr.runbookBaseUrl }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ploeg.fullname" . }}
  labels:
    {{- include "ploeg.labels" . | nindent 4 }}
    {{- with $pr.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: ploeg
      rules:
        {{- with $a.stuckShift }}
        {{- if .enabled }}
        - alert: PloegShiftStuck
          expr: max by (team) (ploeg_shift_idle_seconds_max{ {{- $sel -}} }) > {{ mulf .idleHours 3600 }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: {{ printf "A Shift of team {{ $labels.team }} has made no Run progress for over %v hours" .idleHours | quote }}
            description: "No Run has started, finished or checkpointed on an open Shift for {{ "{{" }} $value | humanizeDuration {{ "}}" }}. Lease and deadline renewals do not count as progress."
            {{- if $runbook }}
            runbook_url: {{ printf "%s#ploegshiftstuck" $runbook }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- with $a.expiredLease }}
        {{- if .enabled }}
        - alert: PloegLeaseExpired
          expr: max(ploeg_lease_overdue_seconds_max{ {{- $sel -}} }) > {{ .overdueSeconds }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: "A Run holds a Lease past its expiry"
            description: "The most overdue Lease expired {{ "{{" }} $value | humanizeDuration {{ "}}" }} ago and the sweep has not released it."
            {{- if $runbook }}
            runbook_url: {{ printf "%s#ploegleaseexpired" $runbook }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- with $a.leakedModelKey }}
        {{- if .enabled }}
        - alert: PloegModelKeyPastTTL
          expr: max by (state) (ploeg_llm_key_ttl_overrun_seconds_max{ {{- $sel -}} }) > {{ .graceSeconds }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: "An inference account is still {{ "{{" }} $labels.state {{ "}}" }} past its key TTL"
            description: "An account in state {{ "{{" }} $labels.state {{ "}}" }} outlived its key TTL by {{ "{{" }} $value | humanizeDuration {{ "}}" }}. Its gateway key may still be live."
            {{- if $runbook }}
            runbook_url: {{ printf "%s#ploegmodelkeypastttl" $runbook }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- with $a.spendSpike }}
        {{- if .enabled }}
        - alert: PloegSpendSpike
          expr: max(ploeg_settled_spend_usd_last_hour{ {{- $sel -}} }) > {{ .usdPerHour }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: {{ printf "Settled spend in the last hour is above %v USD" .usdPerHour | quote }}
            description: "Ploeg settled {{ "{{" }} $value | printf \"%.2f\" {{ "}}" }} USD onto Shifts in the last hour."
            {{- if $runbook }}
            runbook_url: {{ printf "%s#ploegspendspike" $runbook }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- with $a.trackerWebhookMissing }}
        {{- if .enabled }}
        - alert: PloegTrackerWebhookMissing
          expr: max(ploeg_tracker_webhooks_missing{ {{- $sel -}} }) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: "Tracker projects have no assignment webhook to Ploeg"
            description: "{{ "{{" }} $value {{ "}}" }} configured Vikunja project(s) had no assignment webhook at the last check. Assignments there do not reach Ploeg."
            {{- if $runbook }}
            runbook_url: {{ printf "%s#ploegtrackerwebhookmissing" $runbook }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- with $a.credentialLeak }}
        {{- if .enabled }}
        - alert: PloegCredentialLeak
          expr: max(increase(ploeg_runs_failed_total{reason="credential_leak",{{ $sel }}}[15m])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: "A Run carried one of its credentials to the forge"
            description: "{{ "{{" }} $value | printf \"%.0f\" {{ "}}" }} Run(s) failed with credential_leak in the last 15 minutes. Rotate the Run's model key and forge token, then read the commits the Run left on its branch; ploegd's log names the Run and the route."
            {{- if $runbook }}
            runbook_url: {{ printf "%s#ploegcredentialleak" $runbook }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- with $a.runsIdleKilled }}
        {{- if .enabled }}
        - alert: PloegRunsIdleKilled
          expr: sum by (team) (increase(ploeg_runs_finished_total{outcome="failed",reason=~"idle|timeout",{{ $sel }}}[{{ .window }}])) >= {{ .kills }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: {{ printf "Team {{ $labels.team }} had %v or more Runs killed by the idle or total timeout within %s" .kills .window | quote }}
            description: "{{ "{{" }} $value | printf \"%.0f\" {{ "}}" }} Run(s) of team {{ "{{" }} $labels.team {{ "}}" }} failed with reason idle or timeout. Each kill throws away the Run's work and spend, and the Round retries the Role."
            {{- if $runbook }}
            runbook_url: {{ printf "%s#ploegrunsidlekilled" $runbook }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- with $a.runsFailingRepeatedly }}
        {{- if .enabled }}
        - alert: PloegRunsFailingRepeatedly
          expr: sum by (team, role) (increase(ploeg_runs_finished_total{outcome="failed",{{ $sel }}}[{{ .window }}])) >= {{ .failures }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: {{ printf "Role {{ $labels.role }} of team {{ $labels.team }} failed %v or more Runs within %s" .failures .window | quote }}
            description: "{{ "{{" }} $value | printf \"%.0f\" {{ "}}" }} Run(s) of Role {{ "{{" }} $labels.role {{ "}}" }} on team {{ "{{" }} $labels.team {{ "}}" }} ended failed, whatever the reason. ploeg_runs_finished_total{outcome=\"failed\"} by reason says which."
            {{- if $runbook }}
            runbook_url: {{ printf "%s#ploegrunsfailingrepeatedly" $runbook }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- with $a.sandboxStartFailing }}
        {{- if .enabled }}
        - alert: PloegSandboxStartFailing
          expr: sum by (team) (increase(ploeg_runs_finished_total{outcome="failed",reason="infra_node",{{ $sel }}}[{{ .window }}])) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: {{ printf "A Run of team {{ $labels.team }} failed on its node within %s" .window | quote }}
            description: "A Run of team {{ "{{" }} $labels.team {{ "}}" }} failed with infra_node: its sandbox or pod did not start, or its node failed under it. The failure lands on whichever Run of the team was pending, not necessarily the one that waited."
            {{- if $runbook }}
            runbook_url: {{ printf "%s#ploegsandboxstartfailing" $runbook }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- with $a.shiftNoDelivery }}
        {{- if .enabled }}
        - alert: PloegShiftNoDelivery
          expr: max by (team) (ploeg_shift_runs_without_pr_max{ {{- $sel -}} }) >= {{ .runs }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: {{ printf "An open Shift of team {{ $labels.team }} has finished %v or more Runs without a pull request" .runs | quote }}
            description: "An open Shift of team {{ "{{" }} $labels.team {{ "}}" }} has {{ "{{" }} $value {{ "}}" }} finished Runs and no recorded pull request."
            {{- if $runbook }}
            runbook_url: {{ printf "%s#ploegshiftnodelivery" $runbook }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- with $a.queueStalled }}
        {{- if .enabled }}
        - alert: PloegQueueStalled
          expr: max by (team) (ploeg_work_item_oldest_queued_seconds{ {{- $sel -}} }) > {{ .waitSeconds }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: {{ printf "A Work Item of team {{ $labels.team }} has waited over %v seconds for a worker" .waitSeconds | quote }}
            description: "The longest-waiting claimable Work Item of team {{ "{{" }} $labels.team {{ "}}" }} has been queued for {{ "{{" }} $value | humanizeDuration {{ "}}" }}."
            {{- if $runbook }}
            runbook_url: {{ printf "%s#ploegqueuestalled" $runbook }}
            {{- end }}
        {{- end }}
        {{- end }}
        {{- with $a.settlementBacklog }}
        {{- if .enabled }}
        - alert: PloegSettlementBacklog
          expr: max by (state) (ploeg_llm_accounts_unsettled{ {{- $sel -}} }) > 0
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
          annotations:
            summary: "Inference accounts of finished Runs stay {{ "{{" }} $labels.state {{ "}}" }} and unsettled"
            description: "{{ "{{" }} $value {{ "}}" }} inference account(s) in state {{ "{{" }} $labels.state {{ "}}" }} belong to finished Runs and still hold Shift budget. The settlement sweep has not settled them."
            {{- if $runbook }}
            runbook_url: {{ printf "%s#ploegsettlementbacklog" $runbook }}
            {{- end }}
        {{- end }}
        {{- end }}
{{- end }}
