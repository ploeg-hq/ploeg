# CI-only values: the claude-runner in a gateway namespace (ADR-0197 section
# 7). The orchestrator alone holds the environment secret, placed like the
# gateway; each session runs in a runner Job whose pod holds no Secret, no
# ServiceAccount token and no Claude login, and reaches only DNS, the gateway
# and Anthropic (scripts/check-claude-runner-orchestrator.py).
networkPolicy:
  ploegd:
    ingressFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: gateway
claudeRunner:
  enabled: true
  mode: orchestrator
  runtimeClassName: kata
  environmentSecret:
    name: claude-runner-environment
  env:
    DISABLE_ERROR_REPORTING: "1"
executor:
  enabled: true
  type: keda
  namespace: ploeg-workers
  nodeSelector:
    ploeg.example/pool: runs
  credentialGateway:
    enabled: true
  teams:
    - name: silver
      model: litellm_proxy/deepseek-chat
      budget: "4"
      maxReplicaCount: 1
      harness: {dind: false}
supportProfile: unsupported
