# CI-only values: the claude-runner in a gateway namespace (ADR-0197 section
# 7). The orchestrator alone holds the environment secret, placed like the
# gateway; each session runs in a runner Job whose pod holds no Secret, no
# ServiceAccount token and no Claude login, and reaches only DNS, the gateway
# and Anthropic (scripts/check-claude-runner-orchestrator.py). Team pewter's
# builder starts through the person's own routine; no worker renders for it.
env:
  PLOEG_CLAUDE_ENVIRONMENTS: "true"
  PLOEG_CLAUDE_ROUTINES: "true"
networkPolicy:
  ploegd:
    ingressFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: gateway
claudeRunner:
  enabled: true
  mode: orchestrator
  runtimeClassName: kata
  environmentSecret:
    name: claude-runner-environment
  env:
    DISABLE_ERROR_REPORTING: "1"
executor:
  enabled: true
  type: keda
  namespace: ploeg-workers
  nodeSelector:
    ploeg.example/pool: runs
  credentialGateway:
    enabled: true
  teams:
    - name: silver
      model: litellm_proxy/deepseek-chat
      budget: "4"
      maxReplicaCount: 1
      harness: {dind: false}
    - name: pewter
      model: litellm_proxy/claude-sonnet-5
      budget: "1"
      harness: {dind: false}
      plan:
        - roles:
            - name: builder
              writes: true
              harness:
                name: claude-environment
                dind: false
                claudeEnvironment:
                  environmentId: ccpool_example
                  carrier: routine
supportProfile: unsupported
