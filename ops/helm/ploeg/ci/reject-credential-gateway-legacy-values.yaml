# CI-only values that MUST fail to render (scripts/helm-golden.sh): legacy
# worker auth hands a Run pod a static model key, and gateway mode lets no
# secret into a Run pod (ADR-0197).
executor:
  enabled: true
  credentialGateway:
    enabled: true
  workerAuth:
    mode: legacy
  teams:
    - name: silver
      model: litellm_proxy/deepseek-chat
      budget: "4"
      harness: {dind: false}
