# CI-only values layered on executor-credential-gateway-values.yaml: the same
# teams under the CronJob executor, without the sandbox team, so the gateway
# checks cover a CronJob Run pod too (scripts/check-credential-gateway.py).
executor:
  type: cronjob
  teams:
    - name: silver
      model: litellm_proxy/deepseek-chat
      budget: "4"
      maxReplicaCount: 1
      harness: {dind: false}
      plan:
        - roles:
            - {name: builder, writes: true, cap: "3.00"}
        - roles:
            - {name: reviewer, writes: false, cap: "0.75"}
    - name: zinc
      model: litellm_proxy/deepseek-chat
      budget: "2"
      maxReplicaCount: 1
      harness: {dind: false}
      runtimeClassName: gvisor
