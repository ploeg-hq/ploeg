# CI-only values that MUST fail to render (scripts/helm-golden.sh): the per-Run
# capability the credential gateway accepts is the HMAC controlToken, which
# hmacCapability off stops issuing (ADR-0197).
transactionToken:
  issuer: https://ploeg.example.com
  signingKeySecret:
    name: ploeg-transaction-token
    key: signing-key.pem
config:
  teams:
    silver:
      sponsor: oidc-0123456789abcdef0123456789abcdef
executor:
  enabled: true
  credentialGateway:
    enabled: true
  workerAuth:
    hmacCapability: "off"
  teams:
    - name: silver
      model: litellm_proxy/deepseek-chat
      budget: "4"
      harness: {dind: false}
