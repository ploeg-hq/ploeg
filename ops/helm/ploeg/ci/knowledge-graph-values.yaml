# ADR-0087/0088 (proposed): ploegd writes and serves Work Item Notes from a
# Tenant's notes graph. The golden pins that only ploegd gets the run actor's
# token and that the daemon label stays on ploegd alone.
knowledgeGraph:
  url: http://omnigraph.ai.svc.cluster.local:8080
  notesGraph: acme-notes
  runTokenSecret:
    name: ploeg-omnigraph-run
    key: token
