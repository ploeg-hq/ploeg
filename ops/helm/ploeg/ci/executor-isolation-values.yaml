# CI-only values: credential isolation is mandatory (ADR-0034, amended
# 2026-11-18), so every qualified harness renders with both proxies on, and an
# explicit credentialIsolation: proxy override on a Role renders the same.
# The cases that fail the render are the reject-*-values fixtures.
executor:
  enabled: true
  forgejo:
    readTokenSecret:
      name: agent-reader-token
      key: FORGEJO_TOKEN
  teams:
    - name: qualified
      model: litellm_proxy/deepseek-chat
      budget: "1"
      harness: {name: openhands, dind: false}
    - name: exec
      model: litellm_proxy/deepseek-chat
      budget: "1"
      harness: {name: exec, args: ["/bin/cat", "{taskspec}"], dind: false}
    - name: acp-openhands
      model: litellm_proxy/deepseek-chat
      budget: "1"
      harness: {name: acp, dind: false, acp: {profile: openhands}}
    - name: override
      model: litellm_proxy/deepseek-chat
      budget: "2"
      harness: {name: openhands, dind: false}
      plan:
        - roles:
            - {name: optin, writes: false, cap: "0.50", harness: {credentialIsolation: proxy}}
        - roles:
            - {name: builder, writes: true, cap: "1.00"}
supportProfile: unsupported
