# CI-only values that MUST fail to render (scripts/helm-golden.sh): a
# worker-dispatched claude-environment Run holds a Claude login in the worker
# that dispatches it, so in a gateway namespace a session starts only through
# the person's own routine (ADR-0197 section 7).
claudeRunner:
  enabled: true
  mode: orchestrator
  environmentSecret:
    name: claude-runner-environment
executor:
  enabled: true
  credentialGateway:
    enabled: true
  teams:
    - name: pewter
      model: litellm_proxy/claude-sonnet-5
      budget: "1"
      harness:
        name: claude-environment
        image: registry.example/claude-dispatch:0.1.0@sha256:db06af1d9c0969ed594a21ee2b3369a79d6e91abb36b94d29223918581963027
        dind: false
        claudeEnvironment:
          environmentId: ccpool_example
supportProfile: unsupported
