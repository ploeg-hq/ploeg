# CI-only values that MUST fail to render (scripts/helm-golden.sh): a routine
# session clones and pushes only through the gateway, from a runner pod the
# chart's orchestrator started (ADR-0197 section 7).
env:
  PLOEG_CLAUDE_ROUTINES: "true"
executor:
  enabled: true
  credentialGateway:
    enabled: true
  teams:
    - name: pewter
      model: litellm_proxy/claude-sonnet-5
      budget: "1"
      harness:
        name: claude-environment
        dind: false
        claudeEnvironment:
          environmentId: ccpool_example
          carrier: routine
supportProfile: unsupported
