# CI-only values: gateway mode (ADR-0197) in a worker namespace of its own.
# Team `silver` has a writing and a reading Role, `zinc` runs under gVisor,
# `tin` under Kata and `copper` on the sandbox executor. Every Run pod must
# render credential-free and reach only DNS and the credential gateway, and
# the gateway must keep off the Run pods' nodes and executor.nodeSelector's
# pool (scripts/check-credential-gateway.py).
networkPolicy:
  ploegd:
    ingressFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: gateway
executor:
  enabled: true
  type: keda
  namespace: ploeg-workers
  nodeSelector:
    ploeg.example/pool: runs
  forgejo:
    readTokenSecret:
      name: agent-reader-token
      key: FORGEJO_TOKEN
  credentialGateway:
    enabled: true
    mcp:
      egress:
        - to: [{ipBlock: {cidr: 203.0.113.0/24}}]
          ports: [{protocol: TCP, port: 443}]
      adapters:
        - name: grafana
          team: zinc
          image: registry.example/grafana-mcp@sha256:1111111111111111111111111111111111111111111111111111111111111111
          command: ["/usr/local/bin/mcp-grafana", "--transport", "stdio"]
          credentialSecret: {name: grafana-mcp, key: token, env: GRAFANA_API_KEY}
          egress:
            - to: [{ipBlock: {cidr: 10.0.40.0/24}}]
              ports: [{protocol: TCP, port: 3000}]
  teams:
    - name: silver
      model: litellm_proxy/deepseek-chat
      budget: "4"
      maxReplicaCount: 1
      harness: {dind: false}
      plan:
        - roles:
            - {name: builder, writes: true, cap: "3.00"}
        - roles:
            - {name: reviewer, writes: false, cap: "0.75"}
    - name: zinc
      model: litellm_proxy/deepseek-chat
      budget: "2"
      maxReplicaCount: 1
      harness: {dind: false}
      runtimeClassName: gvisor
    - name: tin
      model: litellm_proxy/deepseek-chat
      budget: "2"
      maxReplicaCount: 1
      harness: {dind: false}
      runtimeClassName: kata
    - name: copper
      model: litellm_proxy/deepseek-chat
      budget: "1"
      maxReplicaCount: 1
      executorType: sandbox
      runtimeClassName: kata
      harness:
        name: exec
        args: ["/bin/cat", "{taskspec}"]
        dind: false
supportProfile: unsupported
