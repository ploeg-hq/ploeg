# CI-only values that MUST fail to render (scripts/helm-golden.sh): without
# the NetworkPolicy a gateway-mode Run pod reaches ploegd, the forge and the
# model gateway directly, around the credential gateway (ADR-0197).
executor:
  enabled: true
  credentialGateway:
    enabled: true
  teams:
    - name: silver
      model: litellm_proxy/deepseek-chat
      budget: "4"
networkPolicy:
  enabled: false
supportProfile: unsupported
