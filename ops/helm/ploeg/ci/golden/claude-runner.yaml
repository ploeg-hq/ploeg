apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-runner
  labels:
    app.kubernetes.io/name: claude-runner
    app.kubernetes.io/part-of: ploeg
    app.kubernetes.io/instance: ploeg
    app.kubernetes.io/version: "CHART-VERSION"
    helm.sh/chart: ploeg-CHART-VERSION
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: claude-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: claude-runner
        app.kubernetes.io/part-of: ploeg
        ploeg.webgrip.dev/component: claude-runner
    spec:
      runtimeClassName: kata
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: claude-code
          image: ghcr.io/ploeg-hq/claude-runner:CHART-VERSION@sha256:25fbd910e9dfa7f05d0c7079b4ab958f4edd31172caf971a269faba911a6cec8
          command: ["ploeg-install-claude-code"]
          env:
            - name: PLOEG_CLAUDE_CODE_DIR
              value: /opt/claude-code
          securityContext:
            runAsUser: 65532
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: claude-code
              mountPath: /opt/claude-code
      containers:
        - name: runner
          image: ghcr.io/ploeg-hq/claude-runner:CHART-VERSION@sha256:25fbd910e9dfa7f05d0c7079b4ab958f4edd31172caf971a269faba911a6cec8
          args:
            - self-hosted-runner
            - --base-dir
            - /home/runner/work
            - --hooks-dir
            - /opt/ploeg/claude-runner/hooks
            - "--capacity"
            - "1"
            - "--release-idle-session-min"
            - "1"
            - "--kill-session-after-min"
            - "90"
            - "--drain-grace-sec"
            - "600"
            - "--remove-session-state"
            - "--git-host-rewrite"
            - "forgejo-http.forgejo.svc.cluster.local:3000=forgejo.example.com"
          env:
            - name: PLOEG_URL
              value: "http://ploeg:8080"
            - name: DISABLE_ERROR_REPORTING
              value: "1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
          envFrom:
            - secretRef:
                name: claude-runner-environment
          ports:
            - name: health
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 4Gi
            requests:
              cpu: 50m
              memory: 1Gi
          volumeMounts:
            - name: work
              mountPath: /home/runner/work
            - name: claude-code
              mountPath: /opt/claude-code
              readOnly: true
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 10Gi
        - name: claude-code
          emptyDir:
            sizeLimit: 1Gi
