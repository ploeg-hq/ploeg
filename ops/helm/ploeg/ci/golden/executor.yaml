# Source: ploeg/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ploeg
  labels:
    app.kubernetes.io/name: ploeg
    app.kubernetes.io/instance: ploeg
    app.kubernetes.io/version: "CHART-VERSION"
    helm.sh/chart: ploeg-CHART-VERSION
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ploeg
      app.kubernetes.io/instance: ploeg
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ploeg
        app.kubernetes.io/instance: ploeg
    spec:
      serviceAccountName: ploeg
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ploegd
          image: ghcr.io/ploeg-hq/ploegd:CHART-VERSION
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PLOEG_LISTEN
              value: ":8080"
            - name: PLOEG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ploeg-db-app
                  key: uri
            - name: PLOEG_TEAM_PLANS
              value: "{\"gold\":{\"maxFixRounds\":0,\"pool\":\"6\",\"rounds\":[{\"roles\":[{\"cap\":\"0.50\",\"harness\":{\"dind\":false},\"name\":\"analyst\",\"writes\":false},{\"cap\":\"0.50\",\"harness\":{\"dind\":false},\"name\":\"tests\",\"writes\":false}]},{\"roles\":[{\"cap\":\"3.00\",\"model\":\"litellm_proxy/claude-sonnet-5\",\"name\":\"builder\",\"writes\":true}]},{\"roles\":[{\"cap\":\"0.75\",\"harness\":{\"dind\":false},\"model\":\"litellm_proxy/claude-sonnet-5\",\"name\":\"reviewer\",\"writes\":false}]},{\"roles\":[{\"cap\":\"3.00\",\"model\":\"litellm_proxy/claude-sonnet-5\",\"name\":\"builder\",\"writes\":true}]}]}}"
            - name: PLOEG_TEAM_MAX_RUNNING
              value: "{\"zinc\":2}"
            - name: PLOEG_FORGEJO_URL
              value: "https://forgejo.example.com"
            - name: PLOEG_FORGEJO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agent-builder-token
                  key: FORGEJO_TOKEN
            - name: PLOEG_FORGEJO_BOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-builder-password
                  key: FORGEJO_BOT_PASSWORD
            - name: PLOEG_FORGEJO_BOT
              value: "agent-builder"
            - name: PLOEG_FORGEJO_SECRET
              valueFrom:
                secretKeyRef:
                  name: ploeg-forge-webhook
                  key: PLOEG_FORGEJO_SECRET
            - name: PLOEG_TARGET_FORGE
              value: "forgejo"
            - name: PLOEG_DEFAULT_TEAM
              value: "default"
            - name: PLOEG_LEASE_TTL
              value: "5m"
            - name: PLOEG_REPORT_GRAFANA_URL
              value: ""
            - name: PLOEG_REPORT_VLOER_URL
              value: ""
            - name: PLOEG_SWEEP_INTERVAL
              value: "15s"
            - name: PLOEG_TEAM_MAP
              value: ""
            - name: PLOEG_USAGE_REPORT
              value: "true"
            - name: LITELLM_ADMIN_URL
              value: "http://litellm.ai.svc.cluster.local:4000"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-litellm-master
                  key: LITELLM_MASTER_KEY
            - name: PLOEG_WORKER_AUTH_MODE
              value: "managed"
            - name: PLOEG_WORKER_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: ploeg-worker-signing
                  key: key
            - name: PLOEG_WORKER_BOOTSTRAPS
              valueFrom:
                secretKeyRef:
                  name: ploeg-worker-bootstrap
                  key: registry.json
            - name: PLOEG_WORKER_LLM_POLICIES
              value: "[{\"budgetUsd\":2,\"models\":[\"deepseek-chat\"],\"role\":\"\",\"team\":\"bronze\",\"ttl\":\"4h\"},{\"budgetUsd\":3,\"models\":[\"claude-sonnet-5\"],\"role\":\"\",\"team\":\"copper\",\"ttl\":\"4h\"},{\"budgetUsd\":1,\"models\":[\"deepseek-chat\"],\"role\":\"\",\"team\":\"tin\",\"ttl\":\"4h\"},{\"budgetUsd\":1,\"models\":[\"deepseek-chat\"],\"role\":\"\",\"team\":\"zinc\",\"ttl\":\"4h\"},{\"budgetUsd\":1,\"models\":[\"claude-sonnet-5\"],\"role\":\"\",\"team\":\"lead\",\"ttl\":\"4h\"},{\"budgetUsd\":0.5,\"models\":[\"deepseek-chat\"],\"role\":\"analyst\",\"team\":\"gold\",\"ttl\":\"4h\"},{\"budgetUsd\":0.5,\"models\":[\"deepseek-chat\"],\"role\":\"tests\",\"team\":\"gold\",\"ttl\":\"4h\"},{\"budgetUsd\":3,\"models\":[\"claude-sonnet-5\"],\"role\":\"builder\",\"team\":\"gold\",\"ttl\":\"4h\"},{\"budgetUsd\":0.75,\"models\":[\"claude-sonnet-5\"],\"role\":\"reviewer\",\"team\":\"gold\",\"ttl\":\"4h\"}]"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 256Mi
---
# Source: ploeg/templates/scaledjob.yaml
# One ScaledJob per (team, Role) — the flagship executor. A team without a
# plan has exactly one Role-less workload, byte-identical to the pre-Shift
# shape; a team with a plan gets one per Role, which is what makes "different
# agents, different harnesses, different images" literally true: pod shape is
# fixed at render time. The shape lives in the shared ploeg.workerPodTemplate
# helper (also used by the CronJob executor): privileged DinD sidecar when the
# harness needs Docker, a shared disk-backed workspace mounted at the SAME
# path in both containers, and zero Kubernetes API authority for the
# LLM-driven process.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: ploeg-worker-bronze
  labels:
    app.kubernetes.io/name: ploeg
    app.kubernetes.io/instance: ploeg
    app.kubernetes.io/version: "CHART-VERSION"
    helm.sh/chart: ploeg-CHART-VERSION
    app.kubernetes.io/managed-by: Helm
    # KEDA copies these labels onto every Job it creates, which is the only way
    # the hazard reaches the Job. Kyverno autogens a Job rule for
    # pod-security-baseline-enforce and a Job selector matches the JOB's own
    # labels — stamping this on the pod template alone left the PolicyException
    # unable to admit the Job, and DinD teams were rejected at admission.
    ploeg.webgrip.dev/privileged-dind: "true"
spec:
  pollingInterval: 30
  minReplicaCount: 0
  maxReplicaCount: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  rollout:
    strategy: gradual # spec updates never kill in-flight runs (backlog #50)
  scalingStrategy:
    strategy: accurate # never eager: open over-scaling bug kedacore/keda#6416 (backlog #47)
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0 # ploeg owns retries; every pod is one auditable run (backlog #51)
    activeDeadlineSeconds: 7200
    template:
      
      
      metadata:
        labels:
          app.kubernetes.io/name: ploeg-worker
          ploeg.webgrip.dev/team: bronze
          # Names the HAZARD, not the workload: this pod carries a privileged
          # docker:dind sidecar, and the ploeg-worker PolicyException is keyed on
          # exactly this label. A pod without dind never carries it and is held to
          # the full baseline — so adding a Role costs no security-repo change, and
          # readers are not waived for a privilege they do not take.
          ploeg.webgrip.dev/privileged-dind: "true"
      spec:
        restartPolicy: Never
        # The shutdown budget for ploeg-worker's SIGTERM path: abort the harness,
        # revoke the per-run credential, settle its spend, report the outcome. The
        # 30s default SIGKILLed the pod mid-report, which is the silence that made a
        # killed run indistinguishable from a hung one and cost the Round an attempt.
        terminationGracePeriodSeconds: 90
        # An identity of the workers' own. Naming none left them on `default`, which
        # both trips require-non-default-serviceaccount and makes every workload in
        # the namespace indistinguishable in an audit log. The token stays unmounted
        # either way — a worker needs no Kubernetes API authority at all.
        serviceAccountName: ploeg-worker
        automountServiceAccountToken: false
        securityContext:
          fsGroup: 1000
        initContainers:
          # Extracts ploeg-worker from the distroless ploegd image via
          # self-copy (no shell in distroless).
          - name: worker-bin
            image: ghcr.io/ploeg-hq/ploegd:CHART-VERSION
            command: ["/usr/local/bin/ploeg-worker", "install", "/mnt/bin/ploeg-worker"]
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - name: worker-bin
                mountPath: /mnt/bin
            resources:
              limits:
                cpu: 50m
                memory: 64Mi
              requests:
                cpu: 50m
                memory: 64Mi
          # DinD sidecar: the harness sandbox and the repo quality gates need a
          # Docker daemon. Requires the ploeg-worker PolicyException. Teams whose
          # harness needs no Docker set harness.dind: false.
          - name: dind
            image: docker.io/library/docker:29.8.2-dind@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1
            restartPolicy: Always
            securityContext:
              privileged: true
            env:
              - name: DOCKER_TLS_CERTDIR
                value: /certs
            startupProbe:
              tcpSocket:
                port: 2376
              periodSeconds: 2
              failureThreshold: 60
              timeoutSeconds: 5
            volumeMounts:
              - name: docker-certs
                mountPath: /certs
              - name: docker-storage
                mountPath: /var/lib/docker
              - name: ci-shared
                mountPath: /mnt/ci-shared
            resources:
              limits:
                cpu: "1"
                memory: 1536Mi
              requests:
                cpu: "1"
                memory: 1536Mi
        containers:
          - name: worker
            image: registry.example/agent-runner:1.3.0
            command: ["/mnt/bin/ploeg-worker"]
            env:
              - name: PLOEG_API_URL
                value: "http://ploeg:8080"
              - name: PLOEG_TEAM
                value: "bronze"
              - name: PLOEG_HARNESS
                value: "openhands"
              - name: PLOEG_HARNESS_TIMEOUT
                value: "100m"
              - name: PLOEG_HARNESS_IDLE_TIMEOUT
                value: "15m"
              - name: LLM_MODEL
                value: "litellm_proxy/deepseek-chat"
              - name: LITELLM_KEY_BUDGET
                value: "2"
              - name: LITELLM_KEY_DURATION
                value: "4h"
              - name: LLM_BASE_URL
                value: "http://litellm.ai.svc.cluster.local:4000/v1"
              - name: PLOEG_LLM_CREDENTIAL_MODE
                value: "managed"
              - name: PLOEG_WORKER_BOOTSTRAP_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ploeg-worker-bootstrap
                    key: "bronze--default"
              - name: PLOEG_TARGET_FORGE
                value: "forgejo"
              - name: FORGE_URL
                value: "http://forgejo-http.forgejo.svc.cluster.local:3000"
              - name: AGENT_BUILDER_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: agent-builder-token
                    key: FORGEJO_TOKEN
              # FALLBACK target only. The repository belongs to the work item,
              # resolved at ingest from its tracker scope and delivered on the claim
              # (R11, ADR-0001); these render only while a team still pins a repo,
              # and a team that declares none renders no repo env at all.
              - name: REPO_OWNER
                value: "webgrip"
              - name: REPO_NAME
                value: "example"
              # Base branch for clone/branch/PR (VIK-589). Unset = the repo's
              # default branch on clone and the worker's historical "main".
              - name: PLOEG_BASE_BRANCH
                value: "development"
              # Downward API: node+pod identity survives pod/job cleanup for
              # run forensics (VIK-597). Logged at worker start and embedded in
              # every checkpoint.
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: POD_UID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.uid
              - name: WORK_DIR
                value: /mnt/ci-shared
              - name: DOCKER_HOST
                value: tcp://localhost:2376
              - name: DOCKER_CERT_PATH
                value: /certs/client
              - name: DOCKER_TLS_VERIFY
                value: "1"
            volumeMounts:
              - name: worker-bin
                mountPath: /mnt/bin
                readOnly: true
              - name: docker-certs
                mountPath: /certs
                readOnly: true
              - name: ci-shared
                mountPath: /mnt/ci-shared
            resources:
              limits:
                cpu: "1"
                memory: 1Gi
              requests:
                cpu: "1"
                memory: 1Gi
        volumes:
          - name: worker-bin
            emptyDir: {}
          - name: docker-certs
            emptyDir: {}
          - name: docker-storage
            emptyDir: {}
          # Disk-backed (not tmpfs): repo checkout + gate builds are large.
          # Same absolute path in worker AND dind so `docker run -v`
          # bind-mounts resolve on the daemon's filesystem.
          - name: ci-shared
            emptyDir:
              sizeLimit: 8Gi
  triggers:
    - type: postgresql
      metadata:
        # Resolved by the KEDA operator from ITS namespace, not this one —
        # a bare in-namespace service name never resolves there.
        host: "ploeg-db-rw.default.svc.cluster.local"
        port: "5432"
        userName: "ploeg_scaler"
        dbName: "app"
        sslmode: "require"
        # The one poll-query shape: served index-only by work_items_claimable
        # (backlog #24/#47). Must stay in sync with store.Claim.
        query: "SELECT COUNT(*) FROM work_items WHERE team = 'bronze' AND state = 'queued' AND NOT operator_owned AND (next_eligible_at IS NULL OR next_eligible_at <= now())"
        targetQueryValue: "1"
        activationTargetQueryValue: "0"
      authenticationRef:
        name: ploeg-scaler
