            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: WORK_DIR
          value: /mnt/ci-shared
        - name: DOCKER_HOST
          value: tcp://localhost:2376
        - name: DOCKER_CERT_PATH
          value: /certs/client
        - name: DOCKER_TLS_VERIFY
          value: "1"
        image: registry.example/agent-runner:1.3.0
        name: worker
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "1"
            memory: 1Gi
        volumeMounts:
        - mountPath: /mnt/bin
          name: worker-bin
          readOnly: true
        - mountPath: /certs
          name: docker-certs
          readOnly: true
        - mountPath: /mnt/ci-shared
          name: ci-shared
      dnsPolicy: ClusterFirst
      initContainers:
      - command:
        - /usr/local/bin/ploeg-worker
        - install
        - /mnt/bin/ploeg-worker
        image: ghcr.io/ploeg-hq/ploegd:CHART-VERSION
        name: worker-bin
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /mnt/bin
          name: worker-bin
      - env:
        - name: DOCKER_TLS_CERTDIR
          value: /certs
        image: docker.io/library/docker:29.8.2-dind@sha256:7dcdfc4a20246236f558175182ccace1eb15a41bd3eb119dd2284f393498b7c1
        name: dind
        resources:
          limits:
            cpu: "1"
            memory: 1536Mi
          requests:
            cpu: "1"
            memory: 1536Mi
        restartPolicy: Always
        securityContext:
          privileged: true
        startupProbe:
          failureThreshold: 60
          periodSeconds: 2
          tcpSocket:
            port: 2376
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /certs
          name: docker-certs
        - mountPath: /var/lib/docker
          name: docker-storage
        - mountPath: /mnt/ci-shared
          name: ci-shared
      restartPolicy: Never
      runtimeClassName: kata
      securityContext:
        fsGroup: 1000
      serviceAccountName: ploeg-worker
      terminationGracePeriodSeconds: 90
      volumes:
      - emptyDir: {}
        name: worker-bin
      - emptyDir: {}
        name: docker-certs
      - emptyDir: {}
        name: docker-storage
      - emptyDir:
          sizeLimit: 8Gi
        name: ci-shared
  service: false
  networkPolicyManagement: Managed
  networkPolicy:
    egress:
    - ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
      to:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            k8s-app: kube-dns
    - ports:
      - port: 8080
        protocol: TCP
      to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: ploeg
    - ports:
      - port: 4000
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ai
    - ports:
      - port: 443
        protocol: TCP
      - port: 3000
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: forgejo
    ingress: []
  envVarsInjectionPolicy: Disallowed
