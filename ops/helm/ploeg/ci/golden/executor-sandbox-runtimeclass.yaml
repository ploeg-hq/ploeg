        serviceAccountName: ploeg-sandbox-launcher
        automountServiceAccountToken: true
        containers:
          - name: launcher
            image: ghcr.io/ploeg-hq/ploegd:CHART-VERSION
            command: ["/usr/local/bin/ploeg-worker", "sandbox-launch"]
            env:
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: PLOEG_SANDBOX_JOB_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/job-name']
              - name: PLOEG_SANDBOX_JOB_UID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/controller-uid']
              - name: PLOEG_SANDBOX_WARM_POOL
                value: "ploeg-worker-kata"
              - name: PLOEG_SANDBOX_RUN_DEADLINE
                value: "7200s"
              - name: PLOEG_SANDBOX_SHUTDOWN_MARGIN
                value: "600s"
              - name: PLOEG_SANDBOX_START_TIMEOUT
                value: "600s"
              - name: PLOEG_SANDBOX_TTL_SECONDS_AFTER_FINISHED
                value: "60"
              - name: PLOEG_API_URL
                value: "http://ploeg:8080"
              - name: PLOEG_TEAM
                value: "kata"
              - name: PLOEG_WORKER_ID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.uid
              - name: PLOEG_WORKER_BOOTSTRAP_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ploeg-worker-bootstrap
                    key: "kata--default"
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
            resources:
              limits:
                cpu: 50m
                memory: 32Mi
              requests:
