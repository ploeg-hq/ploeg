# Source: ploeg/templates/mcp.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ploeg-mcp
  labels:
    app.kubernetes.io/name: ploeg-mcp
    app.kubernetes.io/part-of: ploeg
    app.kubernetes.io/instance: ploeg
    app.kubernetes.io/version: "CHART-VERSION"
    helm.sh/chart: ploeg-CHART-VERSION
    app.kubernetes.io/managed-by: Helm
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ploeg-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ploeg-mcp
        app.kubernetes.io/part-of: ploeg
        ploeg.webgrip.dev/component: mcp
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ploeg-mcp
          image: ghcr.io/ploeg-hq/ploegd:CHART-VERSION
          command: ["/usr/local/bin/ploeg-mcp"]
          args: ["http"]
          env:
            - name: PLOEG_URL
              value: "http://ploeg:8080"
            - name: PLOEG_MCP_LISTEN
              value: ":8090"
            - name: PLOEG_MCP_CLIENT_IDS
              value: "ploeg-mcp"
            - name: PLOEG_MCP_GROUPS
              value: "[{\"group\":\"ploeg-operators\",\"tokenEnv\":\"PLOEG_MCP_TOKEN_OPERATORS\",\"execute\":true},{\"group\":\"ploeg-readers\",\"tokenEnv\":\"PLOEG_MCP_TOKEN_READERS\"}]"
            - name: PLOEG_MCP_ISSUER
              value: "https://id.example.com/application/o/ploeg-mcp/"
            - name: PLOEG_MCP_REQUEST_SCOPES
              value: "openid ploeg:read offline_access"
            - name: PLOEG_MCP_RESOURCE
              value: "https://ploeg-mcp.example.com/mcp"
            - name: PLOEG_MCP_SCOPE
              value: "ploeg:read"
            - name: PLOEG_MCP_TOKEN_OPERATORS
              valueFrom:
                secretKeyRef:
                  key: token
                  name: ploeg-mcp-operator
          envFrom:
            - secretRef:
                name: ploeg-mcp-consumers
          ports:
            - name: http
              containerPort: 8090
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
