            - name: PLOEG_WORKER_LLM_POLICIES
              value: "[{\"budgetUsd\":2,\"defaultModel\":\"deepseek-chat\",\"models\":[\"deepseek-chat\"],\"role\":\"\",\"team\":\"bronze\",\"ttl\":\"4h\"}]"
          startupProbe:
