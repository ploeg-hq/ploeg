# Source: ploeg/templates/cronjob.yaml
# The KEDA-free executor (docs/contracts/executor.md): a plain CronJob per
# (team, Role) polls by spawning a worker on a schedule. Empty-handed claim =
# exit 0 (backlog #49) makes idle ticks free; retries stay DB-side (lease
# expiry), so concurrencyPolicy/backoffLimit mirror the ScaledJob semantics.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ploeg-worker-bronze
  labels:
    app.kubernetes.io/name: ploeg
    app.kubernetes.io/instance: ploeg
    app.kubernetes.io/version: "CHART-VERSION"
    helm.sh/chart: ploeg-CHART-VERSION
    app.kubernetes.io/managed-by: Helm
spec:
  schedule: "*/2 * * * *"
  # One run at a time per workload; the Lease (writers) and the Run's own
  # deadline (readers) are the real locks.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      parallelism: 1
      completions: 1
      backoffLimit: 0 # ploeg owns retries; every pod is one auditable run (backlog #51)
      activeDeadlineSeconds: 7200
      template:
        
        
        metadata:
          labels:
            app.kubernetes.io/name: ploeg-worker
            ploeg.webgrip.dev/team: bronze
        spec:
          restartPolicy: Never
          # The shutdown budget for ploeg-worker's SIGTERM path: abort the harness,
          # revoke the per-run credential, settle its spend, report the outcome. The
          # 30s default SIGKILLed the pod mid-report, which is the silence that made a
          # killed run indistinguishable from a hung one and cost the Round an attempt.
          terminationGracePeriodSeconds: 90
          # An identity of the workers' own. Naming none left them on `default`, which
          # both trips require-non-default-serviceaccount and makes every workload in
          # the namespace indistinguishable in an audit log. The token stays unmounted
          # either way — a worker needs no Kubernetes API authority at all.
          serviceAccountName: ploeg-worker
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Extracts ploeg-worker from the distroless ploegd image via
            # self-copy (no shell in distroless).
            - name: worker-bin
              image: ghcr.io/ploeg-hq/ploeg-worker:CHART-VERSION
              command: ["/usr/local/bin/ploeg-worker", "install", "/mnt/bin/ploeg-worker"]
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: worker-bin
                  mountPath: /mnt/bin
              resources:
                limits:
                  cpu: 50m
                  memory: 64Mi
                requests:
                  cpu: 50m
                  memory: 64Mi
            - name: harness
              image: registry.example/agent-runner:1.3.0
              restartPolicy: Always
              command: ["/mnt/bin/ploeg-worker", "harness-serve", "/run/ploeg/launcher/launcher.sock"]
              volumeMounts:
                - name: worker-bin
                  mountPath: /mnt/bin
                  readOnly: true
                - name: harness-launcher
                  mountPath: /run/ploeg/launcher
                  readOnly: true
                - name: ci-shared
                  mountPath: /mnt/ci-shared
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile:
                  type: RuntimeDefault
              resources:
                limits:
                  cpu: "1"
                  memory: 1Gi
                requests:
                  cpu: "1"
                  memory: 1Gi
          containers:
            - name: worker
              image: ghcr.io/ploeg-hq/ploeg-worker:CHART-VERSION
              command: ["/usr/local/bin/ploeg-worker"]
              env:
                - name: PLOEG_API_URL
                  value: "http://ploeg:8080"
                - name: PLOEG_TEAM
                  value: "bronze"
                - name: PLOEG_HARNESS
                  value: "openhands"
                - name: PLOEG_HARNESS_TIMEOUT
                  value: "100m"
                - name: PLOEG_HARNESS_IDLE_TIMEOUT
                  value: "15m"
                - name: LLM_MODEL
                  value: "litellm_proxy/deepseek-chat"
                - name: LITELLM_KEY_BUDGET
                  value: "2"
                - name: LITELLM_KEY_DURATION
                  value: "4h"
                - name: LLM_BASE_URL
                  value: "http://litellm.ai.svc.cluster.local:4000/v1"
                - name: PLOEG_LLM_KEY_ISOLATION
                  value: "proxy"
                - name: PLOEG_FORGE_TOKEN_ISOLATION
                  value: "proxy"
                - name: PLOEG_LLM_CREDENTIAL_MODE
                  value: "managed"
                - name: PLOEG_WORKER_BOOTSTRAP_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: ploeg-worker-bootstrap
                      key: "bronze--default"
                - name: PLOEG_TARGET_FORGE
                  value: "forgejo"
                - name: FORGE_URL
                  value: "http://forgejo-http.forgejo.svc.cluster.local:3000"
                - name: AGENT_BUILDER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: agent-builder-token
                      key: FORGEJO_TOKEN
                # FALLBACK target only. The repository belongs to the work item,
                # resolved at ingest from its tracker scope and delivered on the claim
                # (R11, ADR-0001); these render only while a team still pins a repo,
                # and a team that declares none renders no repo env at all.
                - name: REPO_OWNER
                  value: "webgrip"
                - name: REPO_NAME
                  value: "example"
                # Base branch for clone/branch/PR (VIK-589). Unset = the repo's
                # default branch on clone and the worker's historical "main".
                - name: PLOEG_BASE_BRANCH
                  value: "development"
                # Downward API: node+pod identity survives pod/job cleanup for
                # run forensics (VIK-597). Logged at worker start and embedded in
                # every checkpoint.
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: WORK_DIR
                  value: /mnt/ci-shared
                - name: PLOEG_HARNESS_LAUNCHER
                  value: /run/ploeg/launcher/launcher.sock
                - name: GOMEMLIMIT
                  value: "460MiB"
              volumeMounts:
                - name: ci-shared
                  mountPath: /mnt/ci-shared
                - name: harness-launcher
                  mountPath: /run/ploeg/launcher
                - name: worker-tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                  - ALL
                readOnlyRootFilesystem: true
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile:
                  type: RuntimeDefault
              resources:
                limits:
                  cpu: 250m
                  memory: 512Mi
                requests:
                  cpu: 250m
                  memory: 512Mi
          volumes:
            - name: worker-bin
              emptyDir: {}
            - name: harness-launcher
              emptyDir:
                medium: Memory
                sizeLimit: 1Mi
            - name: worker-tmp
              emptyDir:
                sizeLimit: 1Gi
            # Disk-backed (not tmpfs): repo checkout + gate builds are large.
            # Same absolute path in worker AND dind so `docker run -v`
            # bind-mounts resolve on the daemon's filesystem.
            - name: ci-shared
              emptyDir:
                sizeLimit: 8Gi
