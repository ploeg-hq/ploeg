# Source: ploeg/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ploeg
  labels:
    app.kubernetes.io/name: ploeg
    app.kubernetes.io/instance: ploeg
    app.kubernetes.io/version: "CHART-VERSION"
    helm.sh/chart: ploeg-CHART-VERSION
    app.kubernetes.io/managed-by: Helm
    release: kube-prometheus-stack
spec:
  groups:
    - name: ploeg
      rules:
        - alert: PloegShiftStuck
          expr: max by (team) (ploeg_shift_idle_seconds_max{job="ploeg",namespace="default"}) > 14400
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "A Shift of team {{ $labels.team }} has made no Run progress for over 4 hours"
            description: "No Run has started, finished or checkpointed on an open Shift for {{ $value | humanizeDuration }}. Lease and deadline renewals do not count as progress."
            runbook_url: https://docs.example/ploeg/ops/alerts/#ploegshiftstuck
        - alert: PloegLeaseExpired
          expr: max(ploeg_lease_overdue_seconds_max{job="ploeg",namespace="default"}) > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "A Run holds a Lease past its expiry"
            description: "The most overdue Lease expired {{ $value | humanizeDuration }} ago and the sweep has not released it."
            runbook_url: https://docs.example/ploeg/ops/alerts/#ploegleaseexpired
        - alert: PloegModelKeyPastTTL
          expr: max by (state) (ploeg_llm_key_ttl_overrun_seconds_max{job="ploeg",namespace="default"}) > 900
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "An inference account is still {{ $labels.state }} past its key TTL"
            description: "An account in state {{ $labels.state }} outlived its key TTL by {{ $value | humanizeDuration }}. Its gateway key may still be live."
            runbook_url: https://docs.example/ploeg/ops/alerts/#ploegmodelkeypastttl
        - alert: PloegSpendSpike
          expr: max(ploeg_settled_spend_usd_last_hour{job="ploeg",namespace="default"}) > 12.5
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "Settled spend in the last hour is above 12.5 USD"
            description: "Ploeg settled {{ $value | printf \"%.2f\" }} USD onto Shifts in the last hour."
            runbook_url: https://docs.example/ploeg/ops/alerts/#ploegspendspike
        - alert: PloegTrackerWebhookMissing
          expr: max(ploeg_tracker_webhooks_missing{job="ploeg",namespace="default"}) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Tracker projects have no assignment webhook to Ploeg"
            description: "{{ $value }} configured Vikunja project(s) had no assignment webhook at the last check. Assignments there do not reach Ploeg."
            runbook_url: https://docs.example/ploeg/ops/alerts/#ploegtrackerwebhookmissing
        - alert: PloegCredentialLeak
          expr: max(increase(ploeg_runs_failed_total{reason="credential_leak",job="ploeg",namespace="default"}[15m])) > 0
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "A Run carried one of its credentials to the forge"
            description: "{{ $value | printf \"%.0f\" }} Run(s) failed with credential_leak in the last 15 minutes. Rotate the Run's model key and forge token, then read the commits the Run left on its branch; ploegd's log names the Run and the route."
            runbook_url: https://docs.example/ploeg/ops/alerts/#ploegcredentialleak
