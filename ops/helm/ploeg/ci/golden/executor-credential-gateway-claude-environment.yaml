# Source: ploeg/templates/scaledjob.yaml
# One ScaledJob per (team, Role) — the flagship executor. A team without a
# plan has exactly one Role-less workload, byte-identical to the pre-Shift
# shape; a team with a plan gets one per Role, which is what makes "different
# agents, different harnesses, different images" literally true: pod shape is
# fixed at render time. The shape lives in the shared ploeg.workerPodTemplate
# helper (also used by the CronJob executor): privileged DinD sidecar when the
# harness needs Docker, a shared disk-backed workspace mounted at the SAME
# path in both containers, and zero Kubernetes API authority for the
# LLM-driven process.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: ploeg-worker-silver
  namespace: ploeg-workers
  labels:
    app.kubernetes.io/name: ploeg
    app.kubernetes.io/instance: ploeg
    app.kubernetes.io/version: "CHART-VERSION"
    helm.sh/chart: ploeg-CHART-VERSION
    app.kubernetes.io/managed-by: Helm
spec:
  pollingInterval: 30
  minReplicaCount: 0
  maxReplicaCount: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  rollout:
    strategy: gradual # spec updates never kill in-flight runs (backlog #50)
  scalingStrategy:
    strategy: accurate # never eager: open over-scaling bug kedacore/keda#6416 (backlog #47)
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0 # ploeg owns retries; every pod is one auditable run (backlog #51)
    ttlSecondsAfterFinished: 86400
    activeDeadlineSeconds: 7200
    template:
      
      
      metadata:
        labels:
          app.kubernetes.io/name: ploeg-worker
          ploeg.webgrip.dev/team: silver
      spec:
        restartPolicy: Never
        # The shutdown budget for ploeg-worker's SIGTERM path: abort the harness,
        # revoke the per-run credential, settle its spend, report the outcome. The
        # 30s default SIGKILLed the pod mid-report, which is the silence that made a
        # killed run indistinguishable from a hung one and cost the Round an attempt.
        terminationGracePeriodSeconds: 90
        # An identity of the workers' own. Naming none left them on `default`, which
        # both trips require-non-default-serviceaccount and makes every workload in
        # the namespace indistinguishable in an audit log. The token stays unmounted
        # either way — a worker needs no Kubernetes API authority at all.
        serviceAccountName: ploeg-worker
        automountServiceAccountToken: false
        nodeSelector:
          ploeg.example/pool: runs
        securityContext:
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        initContainers:
          # Extracts ploeg-worker from the distroless ploegd image via
          # self-copy (no shell in distroless).
          - name: worker-bin
            image: ghcr.io/ploeg-hq/ploeg-worker:CHART-VERSION@sha256:cc5bedc5be0fe1c8546671c1ccbf76c62646c87e3bf52908de7c317852848e14
            command: ["/usr/local/bin/ploeg-worker", "install", "/mnt/bin/ploeg-worker"]
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
              - name: worker-bin
                mountPath: /mnt/bin
            resources:
              limits:
                cpu: 50m
                memory: 64Mi
              requests:
                cpu: 50m
                memory: 64Mi
          - name: harness
            image: registry.example/agent-runner:1.3.0@sha256:db06af1d9c0969ed594a21ee2b3369a79d6e91abb36b94d29223918581963027
            restartPolicy: Always
            command: ["/mnt/bin/ploeg-worker", "harness-serve", "/run/ploeg/launcher/launcher.json"]
            volumeMounts:
              - name: worker-bin
                mountPath: /mnt/bin
                readOnly: true
              - name: harness-launcher
                mountPath: /run/ploeg/launcher
                readOnly: true
              - name: ci-shared
                mountPath: /mnt/ci-shared
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            resources:
              limits:
                cpu: "1"
                memory: 1Gi
              requests:
                cpu: "1"
                memory: 1Gi
        containers:
          - name: worker
            image: ghcr.io/ploeg-hq/ploeg-worker:CHART-VERSION@sha256:cc5bedc5be0fe1c8546671c1ccbf76c62646c87e3bf52908de7c317852848e14
            command: ["/usr/local/bin/ploeg-worker"]
            env:
              - name: PLOEG_API_URL
                value: "http://ploeg-credential-gateway.ploeg-workers.svc:8080"
              - name: PLOEG_CREDENTIAL_GATEWAY
                value: "on"
              - name: PLOEG_CREDENTIAL_GATEWAY_FORGE_URL
                value: "http://ploeg-credential-gateway.ploeg-workers.svc:8081"
              - name: PLOEG_CREDENTIAL_GATEWAY_MCP_URL
                value: "http://ploeg-credential-gateway.ploeg-workers.svc:8083"
              - name: PLOEG_TEAM
                value: "silver"
              - name: PLOEG_HARNESS
                value: "openhands"
              - name: PLOEG_HARNESS_TIMEOUT
                value: "100m"
              - name: PLOEG_HARNESS_IDLE_TIMEOUT
                value: "15m"
              - name: LLM_MODEL
                value: "litellm_proxy/deepseek-chat"
              - name: LITELLM_KEY_BUDGET
                value: "4"
              - name: LITELLM_KEY_DURATION
                value: "4h"
              - name: LLM_BASE_URL
                value: "http://ploeg-credential-gateway.ploeg-workers.svc:8082/v1"
              - name: PLOEG_LLM_CREDENTIAL_MODE
                value: "managed"
              - name: PLOEG_TARGET_FORGE
                value: "forgejo"
              # FALLBACK target only. The repository belongs to the work item,
              # resolved at ingest from its tracker scope and delivered on the claim
              # (R11, ADR-0001); these render only while a team still pins a repo,
              # and a team that declares none renders no repo env at all.
              # Downward API: node+pod identity survives pod/job cleanup for
              # run forensics (VIK-597). Logged at worker start and embedded in
              # every checkpoint.
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: POD_UID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.uid
              - name: WORK_DIR
                value: /mnt/ci-shared
              - name: PLOEG_HARNESS_LAUNCHER
                value: /run/ploeg/launcher/launcher.json
              - name: GOMEMLIMIT
                value: "460MiB"
            volumeMounts:
              - name: ci-shared
                mountPath: /mnt/ci-shared
              - name: harness-launcher
                mountPath: /run/ploeg/launcher
              - name: worker-tmp
                mountPath: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            resources:
              limits:
                cpu: 250m
                memory: 512Mi
              requests:
                cpu: 250m
                memory: 512Mi
        volumes:
          - name: worker-bin
            emptyDir: {}
          - name: harness-launcher
            emptyDir:
              medium: Memory
              sizeLimit: 1Mi
          - name: worker-tmp
            emptyDir:
              sizeLimit: 1Gi
          # Disk-backed (not tmpfs): repo checkout + gate builds are large.
          # Same absolute path in worker AND dind so `docker run -v`
          # bind-mounts resolve on the daemon's filesystem.
          - name: ci-shared
            emptyDir:
              sizeLimit: 8Gi
  triggers:
    - type: postgresql
      metadata:
        # Resolved by the KEDA operator from ITS namespace, not this one —
        # a bare in-namespace service name never resolves there.
        host: "ploeg-db-rw.default.svc.cluster.local"
        port: "5432"
        userName: "ploeg_scaler"
        dbName: "app"
        sslmode: "require"
        # The one poll-query shape, served by work_items_claimable (backlog
        # #24/#47). Must stay identical in predicate to store.Claim's
        # nextClaimableQuery, live-Shift clause included.
        query: "SELECT COUNT(*) FROM work_items WHERE team = 'silver' AND state = 'queued' AND NOT operator_owned AND (next_eligible_at IS NULL OR next_eligible_at <= now()) AND NOT EXISTS (SELECT 1 FROM shifts sh WHERE sh.work_item_id = work_items.id AND sh.closed_at IS NULL)"
        targetQueryValue: "1"
        activationTargetQueryValue: "0"
      authenticationRef:
        name: ploeg-scaler
