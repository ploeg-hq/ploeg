apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: ploeg-scaler
  namespace: ploeg-workers
  labels:
    app.kubernetes.io/name: ploeg
    app.kubernetes.io/instance: ploeg
    app.kubernetes.io/version: "CHART-VERSION"
    helm.sh/chart: ploeg-CHART-VERSION
    app.kubernetes.io/managed-by: Helm
spec:
  secretTargetRef:
    - parameter: password
      name: ploeg-scaler
      key: password
