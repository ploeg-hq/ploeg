              - name: PLOEG_LLM_CREDENTIAL_MODE
                value: "managed"
              - name: PLOEG_TARGET_FORGE
                value: "forgejo"
              # FALLBACK target only. The repository belongs to the work item,
              # resolved at ingest from its tracker scope and delivered on the claim
              # (R11, ADR-0001); these render only while a team still pins a repo,
              # and a team that declares none renders no repo env at all.
              # Downward API: node+pod identity survives pod/job cleanup for
              # run forensics (VIK-597). Logged at worker start and embedded in
              # every checkpoint.
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: POD_UID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.uid
              - name: WORK_DIR
                value: /mnt/ci-shared
              - name: PLOEG_HARNESS_LAUNCHER
                value: /run/ploeg/launcher/launcher.json
              - name: GOMEMLIMIT
                value: "460MiB"
            volumeMounts:
              - name: ci-shared
                mountPath: /mnt/ci-shared
              - name: harness-launcher
                mountPath: /run/ploeg/launcher
              - name: worker-tmp
                mountPath: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            resources:
              limits:
                cpu: 250m
                memory: 512Mi
              requests:
                cpu: 250m
                memory: 512Mi
        volumes:
          - name: worker-bin
            emptyDir: {}
          - name: harness-launcher
            emptyDir:
              medium: Memory
              sizeLimit: 1Mi
          - name: worker-tmp
            emptyDir:
              sizeLimit: 1Gi
          # Disk-backed (not tmpfs): repo checkout + gate builds are large.
          # Same absolute path in worker AND dind so `docker run -v`
          # bind-mounts resolve on the daemon's filesystem.
          - name: ci-shared
            emptyDir:
              sizeLimit: 8Gi
  triggers:
    - type: postgresql
      metadata:
        # Resolved by the KEDA operator from ITS namespace, not this one —
        # a bare in-namespace service name never resolves there.
        host: "ploeg-db-rw.default.svc.cluster.local"
        port: "5432"
        userName: "ploeg_scaler"
        dbName: "app"
        sslmode: "require"
        # The one poll-query shape, served by work_items_claimable (backlog
        # #24/#47). Must stay identical in predicate to store.Claim's
        # nextClaimableQuery, live-Shift clause included.
        query: "SELECT COUNT(*) FROM work_items WHERE team = 'tin' AND state = 'queued' AND NOT operator_owned AND (next_eligible_at IS NULL OR next_eligible_at <= now()) AND NOT EXISTS (SELECT 1 FROM shifts sh WHERE sh.work_item_id = work_items.id AND sh.closed_at IS NULL)"
        targetQueryValue: "1"
        activationTargetQueryValue: "0"
      authenticationRef:
        name: ploeg-scaler
---
# Source: ploeg/templates/scaledjob.yaml
# One ScaledJob per (team, Role) — the flagship executor. A team without a
# plan has exactly one Role-less workload, byte-identical to the pre-Shift
# shape; a team with a plan gets one per Role, which is what makes "different
# agents, different harnesses, different images" literally true: pod shape is
# fixed at render time. The shape lives in the shared ploeg.workerPodTemplate
# helper (also used by the CronJob executor): privileged DinD sidecar when the
# harness needs Docker, a shared disk-backed workspace mounted at the SAME
# path in both containers, and zero Kubernetes API authority for the
# LLM-driven process.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: ploeg-worker-copper
  namespace: ploeg-workers
  labels:
    app.kubernetes.io/name: ploeg
    app.kubernetes.io/instance: ploeg
    app.kubernetes.io/version: "CHART-VERSION"
    helm.sh/chart: ploeg-CHART-VERSION
    app.kubernetes.io/managed-by: Helm
spec:
  pollingInterval: 30
  minReplicaCount: 0
  maxReplicaCount: 1
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  rollout:
    strategy: gradual # spec updates never kill in-flight runs (backlog #50)
  scalingStrategy:
    strategy: accurate # never eager: open over-scaling bug kedacore/keda#6416 (backlog #47)
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0 # ploeg owns retries; every pod is one auditable run (backlog #51)
    ttlSecondsAfterFinished: 86400
    activeDeadlineSeconds: 7800
    template:
      
      metadata:
        labels:
          app.kubernetes.io/name: ploeg-sandbox-launcher
          ploeg.webgrip.dev/team: copper
      spec:
        restartPolicy: Never
        serviceAccountName: ploeg-sandbox-launcher
        automountServiceAccountToken: true
        nodeSelector:
          ploeg.example/pool: runs
        containers:
          - name: launcher
            image: ghcr.io/ploeg-hq/ploegd:CHART-VERSION@sha256:da0cc1526c299863f227760b0f3f4d8428fd762de5edfeaa2effe75e3b739a36
            command: ["/usr/local/bin/ploeg-worker", "sandbox-launch"]
            env:
              - name: POD_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: PLOEG_SANDBOX_JOB_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/job-name']
              - name: PLOEG_SANDBOX_JOB_UID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['batch.kubernetes.io/controller-uid']
              - name: PLOEG_SANDBOX_WARM_POOL
                value: "ploeg-worker-copper"
              - name: PLOEG_SANDBOX_RUN_DEADLINE
                value: "7200s"
              - name: PLOEG_SANDBOX_SHUTDOWN_MARGIN
                value: "600s"
              - name: PLOEG_SANDBOX_START_TIMEOUT
                value: "600s"
              - name: PLOEG_SANDBOX_TTL_SECONDS_AFTER_FINISHED
                value: "60"
              - name: GOMEMLIMIT
                value: "28MiB"
              - name: PLOEG_API_URL
                value: "http://ploeg.default.svc:8080"
              - name: PLOEG_TEAM
                value: "copper"
              - name: PLOEG_HARNESS
                value: "exec"
              - name: PLOEG_WORKER_ID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.uid
              - name: PLOEG_WORKER_BOOTSTRAP_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: ploeg-worker-bootstrap
                    key: "copper--default"
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
              seccompProfile:
                type: RuntimeDefault
            resources:
              limits:
                cpu: 50m
                memory: 32Mi
              requests:
                cpu: 10m
                memory: 32Mi
  triggers:
    - type: postgresql
      metadata:
        # Resolved by the KEDA operator from ITS namespace, not this one —
        # a bare in-namespace service name never resolves there.
        host: "ploeg-db-rw.default.svc.cluster.local"
        port: "5432"
        userName: "ploeg_scaler"
        dbName: "app"
        sslmode: "require"
        # The one poll-query shape, served by work_items_claimable (backlog
        # #24/#47). Must stay identical in predicate to store.Claim's
        # nextClaimableQuery, live-Shift clause included.
        query: "SELECT COUNT(*) FROM work_items WHERE team = 'copper' AND state = 'queued' AND NOT operator_owned AND (next_eligible_at IS NULL OR next_eligible_at <= now()) AND NOT EXISTS (SELECT 1 FROM shifts sh WHERE sh.work_item_id = work_items.id AND sh.closed_at IS NULL)"
        targetQueryValue: "1"
        activationTargetQueryValue: "0"
      authenticationRef:
        name: ploeg-scaler
---
