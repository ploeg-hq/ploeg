                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: POD_UID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.uid
              - name: WORK_DIR
                value: /mnt/ci-shared
              - name: PLOEG_HARNESS_LAUNCHER
                value: /run/ploeg/launcher/launcher.json
              - name: GOMEMLIMIT
                value: "460MiB"
            volumeMounts:
              - name: ci-shared
                mountPath: /mnt/ci-shared
              - name: harness-launcher
                mountPath: /run/ploeg/launcher
              - name: worker-tmp
                mountPath: /tmp
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsGroup: 1000
              runAsNonRoot: true
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault
            resources:
              limits:
                cpu: 250m
                memory: 512Mi
              requests:
                cpu: 250m
                memory: 512Mi
        volumes:
          - name: worker-bin
            emptyDir: {}
          - name: harness-launcher
            emptyDir:
              medium: Memory
              sizeLimit: 1Mi
          - name: worker-tmp
            emptyDir:
              sizeLimit: 1Gi
          # Disk-backed (not tmpfs): repo checkout + gate builds are large.
          # Same absolute path in worker AND dind so `docker run -v`
          # bind-mounts resolve on the daemon's filesystem.
          - name: ci-shared
            emptyDir:
              sizeLimit: 8Gi
  triggers:
    - type: postgresql
      metadata:
        # Resolved by the KEDA operator from ITS namespace, not this one —
        # a bare in-namespace service name never resolves there.
        host: "ploeg-db-rw.default.svc.cluster.local"
        port: "5432"
        userName: "ploeg_scaler"
        dbName: "app"
        sslmode: "require"
        # THE claim predicate for a Role, and it must stay byte-identical to
