# CI-only values that MUST fail to render (scripts/helm-golden.sh): the
# claude-runner pod runs an agent's Claude Code with the environment Secret
# and the Run's forge token, and has no gateway route yet (ADR-0197).
claudeRunner:
  enabled: true
  environmentSecret:
    name: claude-runner-environment
executor:
  enabled: true
  credentialGateway:
    enabled: true
  teams:
    - name: silver
      model: litellm_proxy/deepseek-chat
      budget: "4"
      harness: {dind: false}
supportProfile: unsupported
