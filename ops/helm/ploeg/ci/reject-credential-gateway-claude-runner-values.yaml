# CI-only values that MUST fail to render (scripts/helm-golden.sh): a fixed
# claude-runner fleet mounts the environment secret into the pod where
# sessions run, so a gateway namespace runs only the orchestrator (ADR-0197
# section 7).
claudeRunner:
  enabled: true
  mode: fleet
  environmentSecret:
    name: claude-runner-environment
executor:
  enabled: true
  credentialGateway:
    enabled: true
  teams:
    - name: silver
      model: litellm_proxy/deepseek-chat
      budget: "4"
      harness: {dind: false}
supportProfile: unsupported
