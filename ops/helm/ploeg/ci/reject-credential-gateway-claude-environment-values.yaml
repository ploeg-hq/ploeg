# CI-only values that MUST fail to render (scripts/helm-golden.sh):
# claude-environment holds a person's login in its pod and its Anthropic
# traffic has no gateway upstream yet (ADR-0197).
executor:
  enabled: true
  credentialGateway:
    enabled: true
  teams:
    - name: pewter
      model: litellm_proxy/claude-sonnet-5
      budget: "1"
      harness:
        name: claude-environment
        image: registry.example/claude-dispatch:0.1.0@sha256:db06af1d9c0969ed594a21ee2b3369a79d6e91abb36b94d29223918581963027
        dind: false
        claudeEnvironment:
          environmentId: ccpool_example
          loginVolume: pewter-claude-login
