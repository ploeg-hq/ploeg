# CI-only values that MUST fail to render (scripts/helm-golden.sh): a
# runtime Team pool's worker holds a pool bootstrap and the in-worker
# credential proxies, so it cannot run beside gateway mode (ADR-0197,
# ADR-0198).
executor:
  enabled: true
  credentialGateway:
    enabled: true
  harness:
    image: harbor.webgrip.dev/webgrip/openhands-agent:0.1.0
  teams:
    - name: bronze
      model: litellm_proxy/deepseek-chat
      budget: "2"
  runtimeTeams:
    enabled: true
    pools:
      - {tenant: default, harness: openhands}
config:
  teamCreation: {enabled: true, models: [m]}
supportProfile: unsupported
