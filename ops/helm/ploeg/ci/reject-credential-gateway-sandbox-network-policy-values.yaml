# CI-only values that MUST fail to render (scripts/helm-golden.sh): a managed
# sandbox NetworkPolicy adds its rules to the Run pod's egress, and a
# gateway-mode Run pod reaches only DNS and the credential gateway (ADR-0197).
executor:
  enabled: true
  credentialGateway:
    enabled: true
  sandbox:
    networkPolicy:
      egress:
        - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
  teams:
    - name: copper
      model: litellm_proxy/deepseek-chat
      budget: "1"
      executorType: sandbox
      harness: {dind: false}
supportProfile: unsupported
