runIdentity:
  issuer: https://ploeg.example.com
  signingKeySecret:
    name: ploeg-run-identity
    key: signing-key.pem
  retiredKeysSecret:
    name: ploeg-run-identity
    key: retired-keys.pem
transactionToken:
  issuer: https://ploeg.example.com
  audience: urn:ploeg:example
  signingKeySecret:
    name: ploeg-transaction-token
    key: signing-key.pem
  retiredKeysSecret:
    name: ploeg-transaction-token
    key: retired-keys.pem
config:
  teams:
    silver:
      sponsor: oidc-0123456789abcdef0123456789abcdef
tracker:
  github:
    appId: "123456"
    appPrivateKeySecret:
      name: ploeg-github-app
      key: private-key.pem
    webhookSecret:
      name: ploeg-github-webhook
      key: PLOEG_GITHUB_TRACKER_SECRET
executor:
  enabled: true
  forge: github
  forgejo: null
  github:
    url: https://github.com
    tokenSecret:
      name: agent-builder-token
      key: GITHUB_TOKEN
    readTokenSecret:
      name: agent-reader-token
      key: GITHUB_TOKEN
    webhookSecret:
      name: ploeg-github-forge-webhook
      key: PLOEG_GITHUB_FORGE_SECRET
    botLogin: ploeg[bot]
  workerAuth:
    mode: managed
    hmacCapability: "off"
    signingKeySecret:
      name: ploeg-worker-signing
      key: key
    bootstrapSecret:
      name: ploeg-worker-bootstrap
      registryKey: registry.json
  teams:
    - name: silver
      model: litellm_proxy/claude-sonnet-5
      budget: "6"
      maxReplicaCount: 1
      harness:
        name: claude-code
        dind: false
        claudeCode:
          plugins:
            - name: session-link
              marketplace:
                url: https://github.com/example/claude-plugins.git
                commit: 0123456789abcdef0123456789abcdef01234567
              env:
                - {name: LINK_URL, value: https://link.example.com}
                - {name: LINK_TOKEN, secret: {name: session-link-plugin, key: token}}
              hookTimeout: 15s
              runIdentity:
                audience: https://link.example.com
      plan:
        - roles:
            - {name: builder, writes: true, cap: "3.00"}
        - roles:
            - {name: reviewer, writes: false, cap: "0.75", harness: {dind: false}}
supportProfile: unsupported
