# CI-only values: the self-hosted Claude runner with a login volume (ADR-0084).
# No claude-environment team renders beside it: credential isolation is
# mandatory and that harness is not qualified (ADR-0034, amended 2026-11-18).
claudeRunner:
  enabled: true
  name: claude-runner
  runtimeClassName: kata
  environmentSecret:
    name: claude-runner-environment
  extraArgs:
    - --git-host-rewrite
    - forgejo-http.forgejo.svc.cluster.local:3000=forgejo.example.com
  env:
    DISABLE_ERROR_REPORTING: "1"
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4318
  loginVolumes:
    - name: pewter-claude-login
      size: 1Gi
      storageClassName: standard
supportProfile: unsupported
