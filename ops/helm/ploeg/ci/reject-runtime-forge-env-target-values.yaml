# CI-only values: a team pinned to its env target (targetSource: env) in a
# release whose only forge is a runtime connection must be refused. Its
# workers hold no forge URL and no forge credential, so the env pin has no
# forge to act on (ADR-0193).
config:
  connections:
    enabled: true
    allow:
      - {port: forge, kind: gitlab, instance: gitlab-main, methods: [gitlab_service_account]}
    instances:
      gitlab-main:
        kind: gitlab
        url: https://gitlab.example.com
  targetRegistration:
    enabled: true
    connections: ["*"]
executor:
  enabled: true
  forge: gitlab
  forgejo: null
  teams:
    - name: silver
      targetSource: env
      repoOwner: team
      repoName: app
      model: litellm_proxy/claude-sonnet-5
      budget: "6"
      maxReplicaCount: 1
      harness:
        name: openhands
        dind: false
supportProfile: unsupported
