# Credential isolation is mandatory (ADR-0034, amended 2026-11-18): a Role a
# person's own client carries renders no worker, and still fails the render.
executor:
  enabled: true
  teams:
    - name: brass
      model: litellm_proxy/claude-sonnet-5
      budget: "1"
      harness:
        name: claude-environment
        image: harbor.webgrip.dev/webgrip/claude-dispatch:0.1.0
        dind: false
        claudeEnvironment:
          environmentId: ccpool_brass
          carrier: client
supportProfile: unsupported
