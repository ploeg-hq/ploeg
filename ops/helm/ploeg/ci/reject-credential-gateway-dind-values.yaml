# CI-only values that MUST fail to render (scripts/helm-golden.sh): DinD runs
# a privileged Docker daemon in the Run pod and hands the harness its client
# certificates (DOCKER_HOST, DOCKER_CERT_PATH, /certs), which is root on the
# node, so no acknowledgement admits it in gateway mode (ADR-0197).
executor:
  enabled: true
  credentialGateway:
    enabled: true
  teams:
    - name: silver
      model: litellm_proxy/deepseek-chat
      budget: "4"
      harness:
        dind: true
        acknowledgePrivilegedDind: true
supportProfile: unsupported
