# ADR-0192: one release serving a self-hosted Forgejo and GitHub. Both blocks
# set url, so both forges are active. executor.forge stays the default forge
# for a Work Target that names none. No worker pod carries FORGE_URL,
# AGENT_BUILDER_TOKEN or a readTokenSecret: each claim carries the Run's forge
# and a credential ploegd minted for that Run alone.
runIdentity:
  issuer: https://ploeg.example.com
  signingKeySecret:
    name: ploeg-run-identity
    key: signing-key.pem
transactionToken:
  issuer: https://ploeg.example.com
  audience: urn:ploeg:example
  signingKeySecret:
    name: ploeg-transaction-token
    key: signing-key.pem
config:
  teams:
    silver:
      sponsor: oidc-0123456789abcdef0123456789abcdef
tracker:
  github:
    appId: "123456"
    appPrivateKeySecret:
      name: ploeg-github-app
      key: private-key.pem
    webhookSecret:
      name: ploeg-github-webhook
      key: PLOEG_GITHUB_TRACKER_SECRET
executor:
  enabled: true
  forge: forgejo
  forgejo:
    url: http://forgejo-http.forgejo.svc.cluster.local:3000
    publicUrl: https://forgejo.example.com
    tokenSecret:
      name: agent-builder-token
      key: FORGEJO_TOKEN
    botPasswordSecret:
      name: agent-builder-password
      key: FORGEJO_BOT_PASSWORD
    botUser: agent-builder
    commitName: agent-builder
    commitEmail: agent-builder@forgejo.example.com
    webhookSecret:
      name: ploeg-forge-webhook
      key: PLOEG_FORGEJO_SECRET
  github:
    url: https://github.com
    webhookSecret:
      name: ploeg-github-forge-webhook
      key: PLOEG_GITHUB_FORGE_SECRET
    botLogin: ploeg[bot]
    commitName: ploeg[bot]
    commitEmail: 123456+ploeg[bot]@users.noreply.github.com
  workerAuth:
    mode: managed
    hmacCapability: "off"
    signingKeySecret:
      name: ploeg-worker-signing
      key: key
    bootstrapSecret:
      name: ploeg-worker-bootstrap
      registryKey: registry.json
  teams:
    - name: silver
      model: litellm_proxy/claude-sonnet-5
      budget: "6"
      maxReplicaCount: 1
      harness:
        name: openhands
        dind: false
      plan:
        - roles:
            - {name: builder, writes: true, cap: "3.00"}
        - roles:
            - {name: reviewer, writes: false, cap: "0.75", harness: {dind: false}}
supportProfile: unsupported
