operator:
  consumers:
    - name: console
      teams:
        - silver
      execute: true
      maxBudgetUsd: 3
      clientIds:
        - console-app
      tokenSecret:
        name: ploeg-console-operator
        key: token
    - name: verifier
      teams:
        - silver
      verify: true
      audiences:
        - ploeg-verifier
      tokenSecret:
        name: ploeg-console-verifier
        key: token
  personTokens:
    issuer: https://id.example.com/application/o/ploeg/
    audience: ploeg
    maxLifetime: 5m
  deliveryPolicies:
    - repositoryId: example
      policySha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      verifierId: docker-verifier-v1
      minTests: 2
      publicationEnabled: false
deploys:
  tokenSecret:
    name: ploeg-deploy-token
    key: token
