operator:
  consumers:
    - name: console
      teams:
        - silver
      execute: true
      maxBudgetUsd: 3
      tokenSecret:
        name: ploeg-console-operator
        key: token
    - name: verifier
      teams:
        - silver
      verify: true
      tokenSecret:
        name: ploeg-console-verifier
        key: token
  deliveryPolicies:
    - repositoryId: example
      policySha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      verifierId: docker-verifier-v1
      minTests: 2
      publicationEnabled: false
deploys:
  tokenSecret:
    name: ploeg-deploy-token
    key: token
