# CI-only values: a telemetry block with no endpoint must be refused by
# values.schema.json, since the worker would refuse to start on it anyway.
executor:
  enabled: true
  teams:
    - name: bronze
      model: litellm_proxy/deepseek-chat
      budget: "2"
      harness:
        image: harbor.webgrip.dev/webgrip/agent:0.1.0
        telemetry:
          signals: [traces]
