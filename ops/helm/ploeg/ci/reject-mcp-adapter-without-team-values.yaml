# CI-only values that MUST fail to render (scripts/helm-golden.sh): a stdio
# MCP adapter names the one Team whose Runs use it, because its sessions
# share one pod, one user and one credential (ADR-0199 section 7).
executor:
  enabled: true
  type: keda
  credentialGateway:
    enabled: true
    mcp:
      adapters:
        - name: grafana
          image: registry.example/grafana-mcp@sha256:1111111111111111111111111111111111111111111111111111111111111111
          command: ["/usr/local/bin/mcp-grafana"]
  teams:
    - name: zinc
      model: litellm_proxy/deepseek-chat
      budget: "2"
      harness: {dind: false}
