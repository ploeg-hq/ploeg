# CI-only values that MUST fail to render (scripts/helm-golden.sh): in gateway
# mode a Claude Code plugin variable may not read any Secret, not only one
# that holds a Ploeg credential (ADR-0139, ADR-0197).
executor:
  enabled: true
  credentialGateway:
    enabled: true
  teams:
    - name: silver
      model: litellm_proxy/claude-sonnet-5
      budget: "4"
      harness:
        name: claude-code
        dind: false
        claudeCode:
          plugins:
            - name: session-link
              marketplace:
                url: https://forgejo.example.com/team/claude-plugins.git
                commit: 0123456789abcdef0123456789abcdef01234567
              env:
                - {name: LINK_URL, value: https://link.example.com}
                - {name: LINK_TOKEN, secret: {name: session-link-plugin, key: token}}
supportProfile: unsupported
