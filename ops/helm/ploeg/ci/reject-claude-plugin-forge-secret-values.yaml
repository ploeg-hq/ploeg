# CI-only values: in a release serving Forgejo and GitHub, a Claude Code
# plugin variable must never read a Secret that holds a forge credential of
# any active forge or the GitHub App key that mints one (ADR-0139, ADR-0192).
# This file points the plugin at the GitHub forge's tokenSecret; the golden
# script also points it at every other forge credential with --set.
runIdentity:
  issuer: https://ploeg.example.com
  signingKeySecret:
    name: ploeg-run-identity
    key: signing-key.pem
transactionToken:
  issuer: https://ploeg.example.com
  audience: urn:ploeg:example
  signingKeySecret:
    name: ploeg-transaction-token
    key: signing-key.pem
config:
  teams:
    silver:
      sponsor: oidc-0123456789abcdef0123456789abcdef
tracker:
  github:
    appId: "123456"
    appPrivateKeySecret:
      name: ploeg-github-app
      key: private-key.pem
    webhookSecret:
      name: ploeg-github-webhook
      key: PLOEG_GITHUB_TRACKER_SECRET
executor:
  enabled: true
  forge: forgejo
  forgejo:
    url: http://forgejo-http.forgejo.svc.cluster.local:3000
    publicUrl: https://forgejo.example.com
    tokenSecret:
      name: agent-builder-token
      key: FORGEJO_TOKEN
    readTokenSecret:
      name: agent-reader-token
      key: FORGEJO_TOKEN
    botPasswordSecret:
      name: agent-builder-password
      key: FORGEJO_BOT_PASSWORD
    botUser: agent-builder
    webhookSecret:
      name: ploeg-forge-webhook
      key: PLOEG_FORGEJO_SECRET
  github:
    url: https://github.com
    tokenSecret:
      name: github-builder-token
      key: GITHUB_TOKEN
    readTokenSecret:
      name: github-reader-token
      key: GITHUB_TOKEN
    webhookSecret:
      name: ploeg-github-forge-webhook
      key: PLOEG_GITHUB_FORGE_SECRET
    botLogin: ploeg[bot]
  workerAuth:
    mode: managed
    hmacCapability: "off"
    signingKeySecret:
      name: ploeg-worker-signing
      key: key
    bootstrapSecret:
      name: ploeg-worker-bootstrap
      registryKey: registry.json
  teams:
    - name: silver
      model: litellm_proxy/claude-sonnet-5
      budget: "6"
      maxReplicaCount: 1
      harness:
        name: claude-code
        dind: false
        claudeCode:
          plugins:
            - name: session-link
              marketplace:
                url: https://forgejo.example.com/team/claude-plugins.git
                commit: 0123456789abcdef0123456789abcdef01234567
              env:
                - {name: LINK_TOKEN, secret: {name: github-builder-token, key: GITHUB_TOKEN}}
      plan:
        - roles:
            - {name: builder, writes: true, cap: "3.00"}
        - roles:
            - {name: reviewer, writes: false, cap: "0.75", harness: {dind: false}}
supportProfile: unsupported
