# CI-only values that MUST fail to render (scripts/helm-golden.sh): a Claude
# login Secret enters the worker container that dispatches the session, and in
# a gateway namespace Ploeg stores, relays and mounts no Claude login
# (ADR-0197 section 7). Set on a Role, so the whole override chain is read.
executor:
  enabled: true
  credentialGateway:
    enabled: true
  teams:
    - name: pewter
      model: litellm_proxy/claude-sonnet-5
      budget: "1"
      harness: {dind: false}
      plan:
        - roles:
            - name: builder
              writes: true
              harness:
                name: claude-environment
                image: registry.example/claude-dispatch:0.1.0@sha256:db06af1d9c0969ed594a21ee2b3369a79d6e91abb36b94d29223918581963027
                dind: false
                claudeEnvironment:
                  environmentId: ccpool_example
                  loginSecret: pewter-claude-login
