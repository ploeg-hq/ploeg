# CI-only values: a Claude Code plugin variable read from the Secret that holds
# the gateway's master key must be refused; a plugin never receives a Ploeg
# credential (ADR-0139).
executor:
  enabled: true
  teams:
    - name: bronze
      model: litellm_proxy/claude-sonnet-5
      budget: "2"
      harness:
        name: claude-code
        image: harbor.webgrip.dev/webgrip/agent:0.1.0
        claudeCode:
          plugins:
            - name: session-link
              marketplace:
                url: https://forgejo.example.com/team/claude-plugins.git
                commit: 0123456789abcdef0123456789abcdef01234567
              env:
                - {name: LINK_TOKEN, secret: {name: agent-litellm-master, key: LITELLM_MASTER_KEY}}
