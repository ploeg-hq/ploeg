project: Unfold consumer terminology snapshot
owner: unfold
source: https://github.com/webgrip/unfold/blob/9c1d53f01fbfb65733800aa75e288341734dc23f/docs/domain/model.yaml
terms:
- name: Ready
  context: Work
  definition: 'A Work Item is ready when it states something we have decided to do,
    or describes a problem in enough detail that a solution can be formulated or at
    least conceived. Ready work can be given to agents. Work that is not ready can
    itself be given to agents whose job is to make it ready. A Client''s Definition
    of Ready adds conditions for that Client''s work; it never removes this baseline.

    '
  see_also:
  - Work Item
  - Acceptance Conditions
  - Follow-Up
  - Client Profile
  - Refinement
- name: Result
  context: Work
  definition: 'What a Work Item delivers, together with the evidence needed to judge
    it. It can be a code change, a research conclusion, a design or another requested
    deliverable.

    '
  not_to_be_confused_with:
  - term: Outcome
    note: Ploeg's terminal code for one Run, such as pr_opened or stuck.
  see_also:
  - Work Item
  - Evidence
  - Review
- name: Review
  context: Work
  definition: 'An assessment of a Result against its Acceptance Conditions and supporting
    Evidence. A favorable assessment is distinct from releasing software to production.

    '
  not_to_be_confused_with:
  - term: Verdict
    note: A reviewing Run's approve or request_changes answer. It is Evidence for
      a Review, not acceptance.
  see_also:
  - Result
  - Acceptance Conditions
  - Evidence
  - Verdict
- name: Session
  context: Participation
  owner: vloer
  definition: 'Vloer''s continuing record of a person''s interaction around work:
    instructions, questions, actions and results. Closing a browser does not erase
    it. A started session is linked to one Ploeg Work Item, Shift and Run.

    '
  not_to_be_confused_with:
  - term: Shift
    note: Ploeg's whole attempt on a Work Item; Ploeg avoids "session" for it.
  see_also:
  - Work Item
  - Shift
  - Crew
- name: Crew
  context: Participation
  owner: vloer
  definition: 'Vloer''s registered, reusable list of one to eight Roles that a Session
    runs in order. Each Role either writes or only reads, and may name its model;
    the final Role gives the review Verdict. An administrator registers crews in configuration
    and a person picks one when starting a Session. In Ploeg''s language this is a
    Team. New text says Team; "Start crew" remains a Vloer interface label.

    '
  not_to_be_confused_with:
  - term: Team
    note: Ploeg's manifest of Roles, budget and concurrency that claims a Work Item.
      Ploeg avoids "crew".
  see_also:
  - Team
  - Role
  - Session
  - Step
- name: Step
  context: Participation
  owner: vloer
  definition: 'A part of one Run that Vloer performs internally, such as one Crew
    role in a delegated Run. A Step is not a separate Ploeg Run and has no Lease or
    budget of its own.

    '
  avoid:
  - role run
  not_to_be_confused_with:
  - term: Run
    note: One Role executing against a Work Item, authorized by Ploeg.
  see_also:
  - Run
  - Crew
  - Vloer
- name: Model
  context: Execution
  definition: 'The trained system that generates responses from supplied input. Its
    responses are used by a Harness; the model is not the whole working agent.

    '
  see_also:
  - Harness
  - Model Provider
