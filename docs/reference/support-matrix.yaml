summary: >-
  Which versions, runtimes, harnesses, forges, trackers and gateways each Ploeg release line supports, which of them a CI job
  exercises, and which a dated record shows working on a live deployment. The supported deployment is profile P1 of the
  [threat model](../security/threat-model.md#the-supported-deployment-profile); a row outside it is unsupported even when the
  source implements it. "Implemented" and "qualified" are different claims: the README lists what the source contains, this
  page lists what is supported and what evidence stands behind it. Each cell links to its evidence, and each limit says what
  the evidence does not cover. Every live record comes from one environment, the maintainer's own cluster, and holds only there.

releaseNotes: >-
  A stable release's notes carry a Qualification section ([stable channel plan](../ops/stable-channel-plan.md#changelog-upgrade-notes-and-deprecations)).
  Generate it from this matrix with `mise run support-matrix -- --notes 0.2.0 --commit <promoted commit>` and paste it into
  the release's notes. Every release's generated notes name this page at the release's own commit, so the matrix a release
  points to is the one that was true when it was cut.

notesIntro: >-
  The supported deployment is profile P1 of the threat model. Rows outside it are unsupported. A qualified-live row names the
  release or commit it was qualified at; promotion to stable does not requalify it.

lines:
  - id: 0.2.0-rc
    title: 0.2.0-rc.N
    state: current
    summary: >-
      The 0.2.0 candidates cut from `development` on every releasable merge (ADR 0116). A qualified-live cell names the
      candidate it was qualified at; later candidates inherit it only through the CI rows that run on every change.
  - id: 0.2.0
    title: v0.2.0
    state: planned
    summary: >-
      The first 0.2 stable, a soaked candidate promoted by fast-forwarding `main` (ADR 0158). Not released. It runs the
      candidate's digests, so it carries the candidate's cells. It is also gated by G1 to G7 of the stable channel plan,
      including an outsider completing the quickstart (#12). Going from 0.1 to 0.2 is a reinstall.

axes:
  - id: kubernetes
    title: Kubernetes
    summary: >-
      The `worker-admission` job starts kind at the oldest and newest Kubernetes the worker admission policy supports, and the
      quickstart runs a full install and one Run on kind 0.33.0's default node, `kindest/node:v1.37.0`. No live record names
      the Kubernetes version of the cluster it ran on.
  - id: database
    title: PostgreSQL
    summary: >-
      Every store, API and worker test, the restore drill and the upgrade drill run on embedded PostgreSQL from
      embedded-postgres v1.34.0, whose default is PostgreSQL 18.3.0. The quickstart runs PostgreSQL 17.6. No live record names
      the PostgreSQL version of the deployment it read.
  - id: network
    title: Network and CNI
    summary: >-
      P1 relies on the chart's default-deny NetworkPolicies, so the CNI must enforce them. A CNI that does not leaves every
      egress limit void.
  - id: runtime
    title: Executors and runtime classes
    summary: >-
      `keda` and `cronjob` workers share the node's kernel under runc. The `sandbox` executor is in P1 only under a runtime
      class whose handler gives each pod its own VM, with the guest's seccomp on (F-41).
  - id: harness
    title: Harnesses
    summary: >-
      A harness is in P1 only once a Run has reached its normal outcome with both credential proxies on. The chart's
      `ploeg.isolationQualifiedHarnesses` lists them and refuses any other under `supportProfile: P1`.
  - id: forge
    title: Forges
    summary: >-
      A writer Run pushes with a token minted for it alone: a GitHub App installation token, or a repository-scoped Forgejo
      token minted with the bot's password.
  - id: tracker
    title: Work sources and trackers
    summary: >-
      Work reaches Ploeg from a tracker webhook or from the operator API. Fixture tests fake each tracker with `httptest`.
  - id: gateway
    title: Model gateway
    summary: >-
      Ploeg mints, caps, watches and revokes one LiteLLM key per Run and settles from the gateway's spend logs.
  - id: tooling
    title: Install tooling
    summary: >-
      The chart is installed with Helm. KEDA is the installer's, needed only by the `keda` executor.
  - id: operations
    title: Installation, security, accounting and recovery
    summary: >-
      The paths an adopter relies on after install, and the drill or record that exercises each.
  - id: features
    title: Features outside the profile
    summary: >-
      Implemented features that the 0.2 supported profile leaves out. The source has them; nothing here supports them.

rows:
  - id: kubernetes-1.28
    axis: kubernetes
    item: 1.28 and older
    cells: {0.2.0-rc: unsupported, 0.2.0: unsupported}
    evidence:
      - doc:
          path: docs/ops/managed-workers.md#upgrade-existing-deployments
          label: managed workers
          contains: ["Kubernetes 1.29 or later, as the DinD sidecar already required: native sidecars are what end the pod when the worker exits."]
    limits: Without native sidecars a Run pod does not end when the worker exits.

  - id: kubernetes-1.29
    axis: kubernetes
    item: "1.29"
    cells: {0.2.0-rc: experimental, 0.2.0: experimental}
    evidence:
      - doc:
          path: docs/ops/managed-workers.md#upgrade-existing-deployments
          label: managed workers
          contains: ["Kubernetes 1.29 or later"]
      - doc:
          path: docs/reference/configuration.md
          label: configuration reference
          contains: ["Native ValidatingAdmissionPolicy over every ploeg-worker Pod in the release namespace (Kubernetes 1.30 or later)"]
    limits: >-
      The documented floor for native sidecars, but below the oldest version CI starts. `security.workerAdmission`, on by default under P1, needs 1.30.
      No job or record runs 1.29.

  - id: kubernetes-1.30
    axis: kubernetes
    item: "1.30"
    cells: {0.2.0-rc: tested-in-ci, 0.2.0: tested-in-ci}
    evidence:
      - ci:
          workflow: ci.yml
          job: worker-admission
          contains: ["kindest/node:v1.30.13", "scripts/check-worker-admission-live.py"]
      - doc:
          path: docs/ops/self-hosting-security.md
          label: self-hosting security
          contains: ["Kubernetes 1.30 and 1.37: the API server must type-check the policy without warnings, admit every rendered worker Pod"]
    limits: The API server admits every rendered worker pod and refuses each hostile variant. No Run executes on 1.30.

  - id: kubernetes-1.31-1.36
    axis: kubernetes
    item: 1.31 to 1.36
    cells: {0.2.0-rc: supported, 0.2.0: supported}
    evidence:
      - doc:
          path: .github/workflows/ci.yml
          label: ci.yml worker-admission step
          contains: ["Start a disposable cluster at the policy's oldest and newest supported Kubernetes"]
      - doc:
          path: docs/how-to/give-runs-a-toolchain-and-checks.md
          label: toolchains
          contains: ["Image volumes need Kubernetes 1.35 or later."]
    limits: Between the two versions CI tests; none of them is run. Toolchain image volumes need 1.35.

  - id: kubernetes-1.37
    axis: kubernetes
    item: "1.37"
    cells: {0.2.0-rc: tested-in-ci, 0.2.0: tested-in-ci}
    evidence:
      - ci:
          workflow: ci.yml
          job: worker-admission
          contains: ["kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"]
      - ci:
          workflow: quickstart.yml
          job: run
          contains: ["scripts/quickstart.sh run", "pinned", "newest", "checkout-chart"]
      - source:
          path: mise.toml
          contains: ['"aqua:kubernetes-sigs/kind" = "0.33.0"']
    limits: >-
      The quickstart creates its cluster without `--image`, so it runs kind 0.33.0's default node, the same
      `kindest/node:v1.37.0` digest `worker-admission` pins. That cluster runs kindnet, outside P1.

  - id: kubernetes-1.38
    axis: kubernetes
    item: 1.38 and newer
    cells: {0.2.0-rc: experimental, 0.2.0: experimental}
    evidence: []
    limits: Newer than the newest version CI starts.

  - id: postgres-18
    axis: database
    item: "18"
    cells: {0.2.0-rc: tested-in-ci, 0.2.0: tested-in-ci}
    evidence:
      - ci:
          workflow: ci.yml
          job: verify
          contains: ["mise run verify"]
      - ci:
          workflow: restore-drill.yml
          job: restore
          contains: ["mise run restore-drill"]
