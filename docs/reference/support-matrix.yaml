      - doc:
          path: docs/research/2026-10-25-restore-drill.md
          label: restore drill
          contains: ["Embedded PostgreSQL 18 in its own data directory, migrated to head."]
    limits: Single-node embedded PostgreSQL 18.3.0, no replication or operator.

  - id: postgres-17
    axis: database
    item: "17"
    cells: {0.2.0-rc: tested-in-ci, 0.2.0: tested-in-ci}
    evidence:
      - ci:
          workflow: quickstart.yml
          job: run
          contains: ["scripts/quickstart.sh run"]
      - source:
          path: ops/quickstart/postgres.yaml
          contains: ["docker.io/library/postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94"]
    limits: One Run on a fresh database; the drills do not run on 17.

  - id: postgres-16
    axis: database
    item: 16 and older
    cells: {0.2.0-rc: experimental, 0.2.0: experimental}
    evidence: []
    limits: No job runs them, and no minimum version is documented.

  - id: cni-cilium
    axis: network
    item: Cilium, enforcing the chart's NetworkPolicies
    cells: {0.2.0-rc: qualified-live, 0.2.0: qualified-live}
    evidence:
      - live:
          record: docs/research/2026-10-26-worker-boundary-qualification.md
          at: 0.2.0-rc.72
          contains: ["Talos Linux, Cilium as the CNI", "plus the namespace default-deny, enforced by Cilium"]
      - ci:
          workflow: ci.yml
          job: verify
          contains: ["mise run verify"]
      - source:
          path: scripts/verify.sh
          contains: ["bash scripts/test-chart-network-policies.sh"]
    limits: >-
      One cluster. The egress probe ran under runc; under Kata only the public forge address was seen refused. The allowlist
      is per namespace and port, not per pod.

  - id: cni-other-enforcing
    axis: network
    item: Another CNI that enforces NetworkPolicy
    cells: {0.2.0-rc: supported, 0.2.0: supported}
    evidence:
      - doc:
          path: docs/security/threat-model.md#profile-p1-unattended-workers-without-docker-credential-proxies-on
          label: threat model, P1 Network row
          contains: ["`networkPolicy.enabled: true`, on a CNI that enforces them"]
    limits: Not run anywhere. Check the rendered policies on your CNI as network policies describes.

  - id: cni-not-enforcing
    axis: network
    item: A CNI that does not enforce NetworkPolicy (kindnet, Flannel)
    cells: {0.2.0-rc: unsupported, 0.2.0: unsupported}
    evidence:
      - doc:
          path: docs/research/2026-10-26-worker-boundary-qualification.md#what-is-not-covered
          label: worker boundary record
          contains: ["on a CNI that does not enforce NetworkPolicy (kindnet, Flannel) the egress row is void"]
    limits: The quickstart runs on kindnet and says so; it is not a P1 deployment.

  - id: transport-encryption
    axis: network
    item: Cross-node pod traffic encrypted by the CNI or a mesh
    cells: {0.2.0-rc: supported, 0.2.0: supported}
    evidence:
      - doc:
          path: docs/security/threat-model.md#profile-p1-unattended-workers-without-docker-credential-proxies-on
          label: threat model, P1 Transport row
          contains: ["Pod-to-pod traffic is encrypted by the CNI or a mesh when it crosses nodes"]
    limits: Required by P1 because `ploegd` serves plain HTTP (F-06, planned for v0.3.0). No record checks it.

  - id: runtime-runc
    axis: runtime
    item: runc with the `cronjob` executor
    cells: {0.2.0-rc: tested-in-ci, 0.2.0: tested-in-ci}
    evidence:
      - ci:
          workflow: quickstart.yml
          job: run
          contains: ["scripts/quickstart.sh run"]
      - source:
          path: ops/quickstart/values.yaml
          contains: ["type: cronjob"]
      - doc:
          path: docs/security/threat-model.md#profile-p1-unattended-workers-without-docker-credential-proxies-on
          label: threat model, P1 Executor row
          contains: ["`executor.type: keda` (KEDA ScaledJob) or `cronjob`"]
    limits: The quickstart's Run uses the `exec` harness on kind. The worker shares the node's kernel.

  - id: runtime-keda
    axis: runtime
    item: runc with the `keda` executor
    cells: {0.2.0-rc: supported, 0.2.0: supported}
    evidence:
      - doc:
          path: docs/security/threat-model.md#profile-p1-unattended-workers-without-docker-credential-proxies-on
          label: threat model, P1 Executor row
          contains: ["`executor.type: keda` (KEDA ScaledJob) or `cronjob`"]
      - doc:
          path: docs/research/2026-10-04-isolation-qualification.md
          label: isolation qualification 2026-10-04
          contains: ["OpenHands ran under the KEDA ScaledJob executor"]
    limits: >-
      CI renders the ScaledJob and the API server admits its pods, but no job installs KEDA or runs a Run through it. The
      2026-10-04 KEDA Runs predate the proxies' placeholder check (Ploeg #64) and name no release.

  - id: runtime-kata-seccomp-on
    axis: runtime
    item: "`sandbox` executor under Kata Containers with guest seccomp on (`disable_guest_seccomp=false`)"
    cells: {0.2.0-rc: supported, 0.2.0: supported}
    evidence:
      - doc:
          path: docs/security/threat-model.md#profile-p1-unattended-workers-without-docker-credential-proxies-on
          label: threat model, P1 Executor row
          contains: ["with the guest's seccomp enabled (Kata `disable_guest_seccomp=false`, [F-41](#findings))"]
      - doc:
          path: docs/research/2026-10-25-credential-proxy-requalification.md
          label: credential proxy requalification
          contains: ["Profile P1: sandbox executor under `runtimeClassName: kata`"]
    limits: >-
      The credential planes were qualified live under Kata at 0.2.0-rc.68 and the network and token boundaries at
      0.2.0-rc.72, both with guest seccomp off. No probe has passed with guest seccomp on, so the privilege row is not
      qualified.

  - id: runtime-kata-seccomp-off
    axis: runtime
    item: Kata Containers with guest seccomp off, as the kata-containers 3.32.0 Talos extension ships it
    cells: {0.2.0-rc: unsupported, 0.2.0: unsupported}
    evidence:
      - doc:
          path: docs/security/threat-model.md#what-the-profile-excludes
          label: threat model, excluded
          contains: ["A VM runtime class whose guest seccomp is off (Kata `disable_guest_seccomp=true`, as the kata-containers 3.32.0 Talos extension ships it)"]
      - doc:
          path: docs/research/2026-10-26-worker-boundary-qualification.md
          label: worker boundary record
          contains: ["**`Seccomp` 0**"]
    limits: The VM boundary holds; the pod's `RuntimeDefault` seccomp filter is not enforced in the guest (F-41).

  - id: runtime-sandbox-not-vm
    axis: runtime
    item: "`sandbox` executor under gVisor (`runsc`), runc or no runtime class"
    cells: {0.2.0-rc: unsupported, 0.2.0: unsupported}
    evidence:
      - doc:
          path: docs/security/threat-model.md#what-the-profile-excludes
          label: threat model, excluded
          contains: ["naming one whose handler is not a VM (gVisor, runc) is outside P1 on the installer's word"]
    limits: The chart refuses a sandbox workload without a `runtimeClassName`; it cannot tell a VM handler from another by name.

  - id: harness-acp-openhands
    axis: harness
    item: "`acp/openhands`"
    cells: {0.2.0-rc: qualified-live, 0.2.0: qualified-live}
    evidence:
      - live:
          record: docs/research/2026-10-25-credential-proxy-requalification.md
          at: 0.2.0-rc.68
          contains: ["Harness: `acp`, profile `openhands`, writer Role `builder`.", "outcome `pr_opened`"]
      - ci:
          workflow: attack-drill.yml
          job: real-binary
          contains: ["OPENHANDS_VERSION", "PLOEG_HOSTILE_REPOSITORY=1"]
    limits: One writer Role in one cluster; a reader Role was not exercised. The attack drill runs the real binary without a model.

  - id: harness-openhands
    axis: harness
    item: "`openhands`"
    cells: {0.2.0-rc: supported, 0.2.0: supported}
    evidence:
      - doc:
          path: docs/security/threat-model.md#profile-p1-unattended-workers-without-docker-credential-proxies-on
          label: threat model, P1 Harness row
          contains: ["One in `ploeg.isolationQualifiedHarnesses` (`openhands`, `acp/openhands`, `exec`)"]
      - doc:
          path: docs/research/2026-10-04-isolation-qualification.md
          label: isolation qualification 2026-10-04
          contains: ["Team silver, KEDA ScaledJob executor."]
    limits: 'Its Runs predate the proxies'' placeholder check (Ploeg #64) and name no release; F-04''s requalification covered `acp/openhands` only.'

  - id: harness-exec
    axis: harness
    item: "`exec`"
    cells: {0.2.0-rc: tested-in-ci, 0.2.0: tested-in-ci}
    evidence:
      - ci:
          workflow: quickstart.yml
          job: run
          contains: ["scripts/quickstart.sh run"]
      - source:
          path: ops/quickstart/values.yaml
          contains: ["name: exec"]
    limits: Plumbing only. A custom command that calls the model must read `LLM_BASE_URL` and `LLM_API_KEY`.

  - id: harness-claude-code
    axis: harness
    item: "`claude-code`, `claude-environment` and the claude-runner"
    cells: {0.2.0-rc: unsupported, 0.2.0: unsupported}
    evidence:
      - doc:
          path: docs/security/threat-model.md#what-the-profile-excludes
          label: threat model, excluded
          contains: ["`claude-environment` and the `claudeRunner`"]
      - doc:
          path: docs/research/2026-10-04-isolation-qualification.md
          label: isolation qualification 2026-10-04
          contains: ["| `claude-code` | no | No Run with both proxies on yet. |"]
    limits: Not qualified with both proxies on; `claude-environment` runs outside the pod on a person's login.

  - id: harness-acp-other
    axis: harness
    item: "`acp/opencode` (the `acp` default), `acp/goose`, `acp/qwen-code`, `acp/custom`"
    cells: {0.2.0-rc: unsupported, 0.2.0: unsupported}
    evidence:
      - doc:
          path: docs/security/threat-model.md#what-the-profile-excludes
          label: threat model, excluded
          contains: ["`claude-code`, `acp/opencode`, `acp/qwen-code`, `acp/goose`, `acp/custom`"]
      - ci:
          workflow: attack-drill.yml
          job: real-binary
          contains: ["OPENCODE_VERSION", "GOOSE_VERSION"]
    limits: The attack drill runs opencode and goose against a hostile repository, which does not qualify the proxies.

  - id: harness-dind
    axis: harness
    item: 'Any harness with `harness.dind: true`'
    cells: {0.2.0-rc: unsupported, 0.2.0: unsupported}
    evidence:
      - doc:
          path: docs/security/threat-model.md#what-the-profile-excludes
          label: threat model, excluded
          contains: ["Privileged sidecar whose client certificates the harness holds. It also turns both credential proxies off"]
    limits: 'Renders only with `harness.acknowledgePrivilegedDind: true`, and never under `supportProfile: P1`.'

  - id: forge-github-app
    axis: forge
    item: GitHub with a GitHub App (per-Run installation tokens)
    cells: {0.2.0-rc: qualified-live, 0.2.0: qualified-live}
    evidence:
      - live:
          record: docs/research/2026-10-23-github-qualification.md
          at: 2fc4ddc
          contains: ["--- PASS: TestQualificationAGitHubRunDeliversAPullRequest (9.88s)", "Both opt-in qualifications now pass on github.com through the App"]
      - ci:
          workflow: ci.yml
          job: verify
          contains: ["mise run verify"]
          test: {package: pkg/forgebroker, name: TestGitHubAppMintsOneRepositoryWithWriterPermissionsAndRevokesByID}
    limits: Against github.com from a workstation, not from a deployed release. Webhooks from github.com have fixture tests only.

  - id: forge-forgejo-15
    axis: forge
    item: Forgejo 15 or later with `botPasswordSecret` (per-Run repository tokens)
    cells: {0.2.0-rc: tested-in-ci, 0.2.0: tested-in-ci}
    evidence:
      - ci:
          workflow: ci.yml
          job: verify
          contains: ["mise run verify"]
          test: {package: pkg/forgebroker, name: TestMint_ScopedToTheRunsRepositoryAndTraceable}
      - ci:
          workflow: ci.yml
          job: verify
          contains: ["mise run verify"]
          test: {package: pkg/forgebroker, name: TestMint_RefusesAndRevokesATokenTheForgeDidNotRestrict}
      - doc:
          path: docs/security/credential-flow.md#qualification-against-a-live-forge
          label: credential flow, live forge
          contains: ["Against Forgejo `15.0.10+gitea-1.22.0` it minted a token for `agent-builder`"]
    limits: >-
      Minting is tested against a fake. The live probe showed Forgejo 15.0.10 refusing a revoked plain token at once; it did
      not run a release's broker. The broker refuses and deletes a token whose mint answer does not name only the Run's
      repository (F-10, ADR-0172); that a restricted token is refused on another repository of a live forge rests on the
      opt-in qualification, not yet run through the broker.

  - id: forge-forgejo-old
    axis: forge
    item: Forgejo before 15
    cells: {0.2.0-rc: unsupported, 0.2.0: unsupported}
    evidence:
      - doc:
          path: docs/security/threat-model.md#profile-p1-unattended-workers-without-docker-credential-proxies-on
          label: threat model, P1 Forge row
          contains: ["Forgejo 15 or later with `botPasswordSecret` (per-Run repository tokens)"]
      - ci:
          workflow: ci.yml
          job: verify
          contains: ["mise run verify"]
          test: {package: cmd/ploegd, name: TestForgeCredentials_RefusesTheBrokerOnAForgeOlderThan15AndNamesTheVersion}
    limits: >-
      Repository-scoped tokens exist only from Forgejo 15. With `botPasswordSecret` set, ploegd reads the forge version at
      start and refuses to run below 15, naming the version (ADR-0172).

  - id: forge-shared-token
    axis: forge
    item: A static shared forge token for writers (no App, no bot password)
    cells: {0.2.0-rc: unsupported, 0.2.0: unsupported}
    evidence:
      - doc:
          path: docs/security/threat-model.md#what-the-profile-excludes
          label: threat model, excluded
          contains: ["Static shared forge token for writers (no App, no bot password)"]
    limits: The quickstart pushes this way to a practice repository, and says it is outside P1.

  - id: forge-gitlab
    axis: forge
