    cells: {0.2.0-rc: unsupported, 0.2.0: unsupported}
    evidence:
      - doc:
          path: docs/security/threat-model.md#what-the-profile-excludes
          label: threat model, excluded
          contains: ["No per-Run GitLab broker exists; GitLab writers always use the shared token"]
    limits: Implemented as a forge; no per-Run broker (F-31).

  - id: tracker-github-issues
    axis: tracker
    item: GitHub Issues
    cells: {0.2.0-rc: qualified-live, 0.2.0: qualified-live}
    evidence:
      - live:
          record: docs/research/2026-10-23-github-qualification.md
          at: 2fc4ddc
          contains: ["--- PASS: TestQualificationGitHubIssuesReadAndWriteBack (4.98s)"]
      - ci:
          workflow: ci.yml
          job: verify
          contains: ["mise run verify"]
    limits: Reads and write-backs against github.com. The webhook from github.com, its signature and redelivery have fixture tests only.

  - id: tracker-vikunja
    axis: tracker
    item: Vikunja
    cells: {0.2.0-rc: tested-in-ci, 0.2.0: tested-in-ci}
    evidence:
      - ci:
          workflow: ci.yml
          job: verify
          contains: ["mise run verify"]
          test: {package: pkg/provider/vikunja, name: TestParseWebhookAssigned}
    limits: Fixture tests only. No record qualifies the tracker against a live Vikunja.

  - id: tracker-clickup
    axis: tracker
    item: ClickUp
    cells: {0.2.0-rc: tested-in-ci, 0.2.0: tested-in-ci}
    evidence:
      - ci:
          workflow: ci.yml
