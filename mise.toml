[settings]
lockfile = true

[tools]
go = "1.27.3"
helm = "4.3.0"
"aqua:kubernetes-sigs/kind" = "0.33.0"
"aqua:kubernetes/kubectl" = "1.36.1"
oras = "1.3.3"
"aqua:prometheus/prometheus" = "3.15.0"
cosign = "2.4.3"
grype = "0.121.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
uv = "0.12.22"
node = "24.21.0"  # runtime for the openspec CLI
"npm:@fission-ai/openspec" = "1.13.2"  # `openspec` — the /opsx workflow (openspec/config.yaml)

[tasks.setup]
run = "mise install"
description = "Install the pinned standalone toolchain"

[tasks.verify]
run = "bash scripts/verify.sh"
description = "Build, test and validate the standalone project"

[tasks.check-provenance]
run = "bash scripts/check-provenance.sh --source"
description = "Check PROVENANCE.md's record against this history and its frozen source"

[tasks.test-alert-rules]
run = "bash scripts/test-alert-rules.sh"
description = "Make every chart alert fire, and stay quiet, on synthetic series (promtool test rules)"

[tasks.restore-drill]
run = "go test -race -count=1 -v -run TestRestoreDrill ./pkg/worker/"
description = "Back up a live database, destroy it, restore it and prove ploegd reconciles and fences every older lease; prints the measured RTO and RPO"

[tasks.upgrade-drill]
run = "go test -race -count=1 -v -timeout 30m -run TestUpgradeDrill ./pkg/worker/"
env = { PLOEG_UPGRADE_DRILL_BASES = "previous v0.2.0-rc.1" }
description = "Restore an older release's backup, migrate it to head, interrupt the migration three ways, and prove ploegd reconciles and fences the older release's workers; prints the measured RTO and RPO"

[tasks.docs-check]
run = "go test ./internal/ledger/ ./pkg/harness/ && uv run --no-project --with pyyaml==6.0.3 python scripts/docs-configuration.py --check && uv run --no-project --with pyyaml==6.0.3 python scripts/check-domain.py && uv run --no-project --with pyyaml==6.0.3 python scripts/support-matrix.py --check"
description = "Validate decisions, contracts, generated configuration and the support matrix's evidence"

[tasks.docs-configuration]
run = "uv run --no-project --with pyyaml==6.0.3 python scripts/docs-configuration.py"

[tasks.support-matrix]
run = "uv run --no-project --with pyyaml==6.0.3 python scripts/support-matrix.py"
description = "Check every support matrix cell against its evidence and regenerate docs/reference/support-matrix.md"

[tasks.domain]
run = "uv run --no-project --with pyyaml==6.0.3 python scripts/generate-domain.py docs/domain/model.yaml -o docs/domain"
